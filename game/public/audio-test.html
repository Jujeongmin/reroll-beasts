<!doctype html>
<meta charset="utf-8" />
<title>소리 확인</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px 16px 56px; background: #14121a; color: #efe9df;
         font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .wrap { max-width: 740px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lead { color: #a49bb0; margin: 0 0 18px; font-size: 13px; }
  .vol { display: flex; align-items: center; gap: 10px; margin: 0 0 6px;
         background: #1e1b26; border: 1px solid #2f2a3a; border-radius: 8px; padding: 9px 12px; }
  .vol input { flex: 1; } .vol b { min-width: 70px; } .vol span { min-width: 32px; text-align: right; color: #a49bb0; }
  h2 { font-size: 13px; color: #c8a15a; margin: 24px 0 8px; letter-spacing: .04em; }
  .row { display: grid; grid-template-columns: 108px 1fr auto; gap: 12px; align-items: center;
         background: #1e1b26; border: 1px solid #2f2a3a; border-radius: 8px; padding: 9px 12px; margin-bottom: 5px; }
  .row.new { border-color: #6b5a3a; }
  .n { font-weight: 600; }
  .n em { font-style: normal; color: #c8a15a; font-size: 10px; display: block; letter-spacing: .06em; }
  .w { color: #a49bb0; font-size: 12.5px; }
  .w span { display: block; color: #6f677c; font-size: 11px; margin-top: 2px; }
  button { font: inherit; font-weight: 600; color: #efe9df; background: #3b3350;
           border: 1px solid #574a72; border-radius: 6px; padding: 6px 15px; cursor: pointer; }
  button:hover { background: #4a4066; }
  button.on { background: #7a5ea8; border-color: #9b7fd0; }
  .note { color: #6f677c; font-size: 12px; margin-top: 24px; }
</style>
<div class="wrap">
  <h1>소리 확인</h1>
  <p class="lead">
    고른 대로 넣었다. 게임에서 나는 그대로 들린다 — 소리마다 정해 둔 크기와
    부르는 쪽 배율까지 먹인 값이다. <b style="color:#c8a15a">바뀜</b> 표시가
    이번에 갈아 끼운 자리다.
  </p>

  <div class="vol"><b>효과음</b><input id="sfxv" type="range" min="0" max="100" step="5" value="80" /><span id="sfxn">80</span></div>
  <div class="vol"><b>배경음</b><input id="bgmv" type="range" min="0" max="100" step="5" value="45" /><span id="bgmn">45</span></div>

  <h2>조작</h2><div id="ui"></div>
  <h2>판</h2><div id="board"></div>
  <h2>전투</h2><div id="fight"></div>
  <h2>판이 끝날 때</h2><div id="end"></div>
  <h2>배경음</h2><div id="bgm"></div>

  <p class="note">
    확인용 페이지다. 됐다고 하면 지운다. 표의 단일소스는
    <code>game/src/audio.js</code>, 파일 반입은 <code>tools/audio-import.mjs</code>.
  </p>
</div>
<script>
  const A = 'assets/audio/'
  // [이름, 파일, 표의 크기, 부르는 쪽 배율, 어디서, 묶음, 바뀌었나]
  const ROWS = [
    ['click', 'ui_click.ogg', 0.8, 1, '버튼을 누를 때 (모든 버튼)', 'ui', 1],
    ['open', 'ui_open.ogg', 0.75, 1, '꾸미기 · 상점 · 패스 · 순위표 · 설정을 열 때', 'ui', 1],
    ['buy', 'ui_buy.ogg', 0.7, 1, '아바타를 샀다 · 미션 보상을 받았다', 'ui', 1],
    ['error', 'ui_error.ogg', 0.6, 1, '거절당했다 — 젬 부족, 대기석 가득, 전투 중 조작', 'ui', 0],
    ['drop', 'ui_drop.ogg', 0.6, 1, '팔았다 · 아이템을 꼈다 · 자동 배치됐다', 'board', 0],
    ['merge (2성)', 'merge.ogg', 0.9, 0.85, '셋이 합쳐져 2성이 됐다', 'board', 1],
    ['merge (3성)', 'merge.ogg', 0.9, 1, '3성이 됐다 — 한 판에 몇 번 없어서 더 크다', 'board', 1],
    ['hit', 'hit.ogg', 0.35, 1, '때린다. 촘촘하면 70ms 간격으로 솎아 낸다', 'fight', 0],
    ['death', 'death.ogg', 0.5, 1, '말이 죽는다', 'fight', 0],
    ['boom (죽으며 터짐)', 'boom.ogg', 0.85, 0.5, '죽으면서 터지는 폭발', 'fight', 1],
    ['boom (이겼다)', 'boom.ogg', 0.85, 1, '내 승리 이펙트가 상대 판에 떨어진다', 'end', 1],
    ['boom (졌다)', 'boom.ogg', 0.85, 0.6, '상대 이펙트가 내 판에 떨어진다', 'end', 1],
    ['win', 'win.ogg', 0.9, 1, '판을 끝까지 갔다', 'end', 0],
    ['lose', 'lose.ogg', 0.8, 1, '체력이 0 이 됐다', 'end', 0],
  ]

  const sfxv = document.getElementById('sfxv')
  const bgmv = document.getElementById('bgmv')
  sfxv.oninput = () => (document.getElementById('sfxn').textContent = sfxv.value)
  bgmv.oninput = () => {
    document.getElementById('bgmn').textContent = bgmv.value
    if (cur) cur.el.volume = (bgmv.value / 100) * cur.mix
  }

  function makeRow(name, tag, desc, sub, label, onPlay, isNew) {
    const d = document.createElement('div')
    d.className = 'row' + (isNew ? ' new' : '')
    d.innerHTML = '<div class="n">' + name + (tag ? '<em>' + tag + '</em>' : '') +
      '</div><div class="w">' + desc + '<span>' + sub + '</span></div>'
    const b = document.createElement('button')
    b.textContent = label
    b.onclick = () => onPlay(b)
    d.appendChild(b)
    return d
  }

  for (const [name, file, base, gain, where, group, isNew] of ROWS) {
    document.getElementById(group).appendChild(
      makeRow(name, isNew ? '바뀜' : '', where,
        file + ' · 크기 ' + Math.round(base * gain * 100) + '%',
        '듣기',
        () => {
          const a = new Audio(A + file)
          a.volume = Math.min(1, (sfxv.value / 100) * base * gain)
          a.play().catch(() => {})
        },
        isNew))
  }

  // 배경음. mix 는 그 화면에서의 몫이다 — 슬라이더 값에 곱해진다.
  const TRACKS = [
    ['home', 'bgm_home.ogg', 0.85, '홈 — 판에 들어가기 전', 0],
    ['battle A', 'bgm_battle_a.ogg', 0.5, '판 안 · 어둡고 낮게 깔리는', 1],
    ['battle B', 'bgm_battle_b.ogg', 0.5, '판 안 · 깊은 우물', 1],
    ['battle C', 'bgm_battle_c.ogg', 0.5, '판 안 · 바다', 1],
  ]
  let cur = null
  for (const [name, file, mix, where, isNew] of TRACKS) {
    document.getElementById('bgm').appendChild(
      makeRow(name, isNew ? '바뀜' : '', where,
        file + ' · 몫 ' + Math.round(mix * 100) + '% (슬라이더 45 이면 ' + Math.round(45 * mix) + ')',
        '틀기',
        (btn) => {
          if (cur && cur.file === file) {
            cur.el.pause(); cur.btn.textContent = '틀기'; cur.btn.classList.remove('on'); cur = null; return
          }
          if (cur) { cur.el.pause(); cur.btn.textContent = '틀기'; cur.btn.classList.remove('on') }
          const el = new Audio(A + file)
          el.loop = true
          el.volume = (bgmv.value / 100) * mix
          el.play().catch(() => {})
          btn.textContent = '멈추기'; btn.classList.add('on')
          cur = { file, el, btn, mix }
        },
        isNew))
  }

  const p = document.createElement('p')
  p.className = 'note'
  p.innerHTML = '판에 들어갈 때마다 A · B · C 중 하나를 뽑는다. ' +
    '<b>전투가 도는 동안에는 곡이 멈춘다</b> — 끄는 게 아니라 멈추므로 배치로 ' +
    '돌아오면 그 자리에서 이어진다.'
  document.getElementById('bgm').appendChild(p)
</script>
