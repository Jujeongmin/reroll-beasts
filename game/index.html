<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Reroll Beasts</title>
<style>
  /* ─────────────────────────────────────────────────────────
     TFT 배치를 따른다. 판이 화면의 주인이고 HUD 는 그 위에 뜬다.

     이 UI 의 뼈대는 **비스듬한 판(평행사변형)** 이다. TFT 의 시너지 줄과
     플레이어 줄이 전부 그 모양이고, 직사각형 목록과는 인상이 완전히 다르다.
     clip-path 로 자른다 — border-radius 로는 못 만드는 각이다.

     세로가 390px 뿐이라 상단·좌우를 띠로 쌓지 않고 판 위에 겹친다.
     ───────────────────────────────────────────────────────── */
  :root {
    --bg: #0e1220;
    --ink: #f3ecdd;
    --dim: #a9a08f;
    --gold: #ffd166;
    --hp: #ff6b7a;
    --xp: #6fd8ff;
    --team-a: #5ff0e0;
    --team-b: #ff7a6f;
    --sell: #e8654f;
    --t1: #9aa3b2; --t2: #4fb96a; --t3: #4f8fe8; --t4: #b06fe8; --t5: #e8b34f;
    --plate: #12101ce8;
    --edge: #ffffff1c;

    --shopH: 108px;
    /* 비스듬한 판의 기울기. 한 곳에서 정해야 좌우가 대칭으로 보인다. */
    --skew: 9px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  ::-webkit-scrollbar { display: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  img { image-rendering: pixelated; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .screen[hidden] { display: none; }

  /* ── 무대 ──────────────────────────────────────────── */
  #stage {
    flex: 1; min-height: 0; position: relative; overflow: hidden;
    background: radial-gradient(130% 100% at 50% 6%, #3a4d7d 0%, #1b2440 50%, #0d1120 100%);
  }
  #stage canvas { display: block; position: relative; }

  /* ── 상단: 라운드 · 라운드 종류 트랙 · 남은 시간 ───── */
  #top {
    position: absolute; top: 0; left: 0; right: 0; height: 44px; z-index: 5;
    display: flex; align-items: flex-start; justify-content: center;
    background: linear-gradient(#0b0e1ae8, #0b0e1a00);
    pointer-events: none;
  }
  #topbar {
    display: flex; align-items: center; gap: 11px; height: 32px; padding: 0 16px;
    background: var(--plate); box-shadow: inset 0 0 0 1px var(--edge);
    clip-path: polygon(11px 0, calc(100% - 11px) 0, 100% 100%, 0 100%);
  }
  #roundtag { font-size: 16px; font-weight: 800; letter-spacing: .5px; color: #fff2e0; }

  /* 라운드 종류 트랙. 마름모 = PvE, 원 = 상대. */
  #track { display: flex; gap: 5px; align-items: center; }
  #track i {
    width: 10px; height: 10px; display: block; border-radius: 50%;
    background: #ffffff24; box-shadow: inset 0 0 0 1px #0007;
  }
  #track i.pve { border-radius: 2px; transform: rotate(45deg); }
  #track i.done { background: #ffffff7d; }
  #track i.now { background: var(--gold); box-shadow: 0 0 9px var(--gold); transform: scale(1.3); }
  #track i.pve.now { transform: rotate(45deg) scale(1.3); }

  #timer {
    display: flex; align-items: center; gap: 5px;
    font-variant-numeric: tabular-nums; font-weight: 800; font-size: 16px;
    min-width: 44px; justify-content: flex-end;
  }
  #timer::before {
    content: ''; width: 12px; height: 12px; border-radius: 50%;
    box-shadow: inset 0 0 0 2px currentColor;
  }
  #timer.warn { color: var(--sell); animation: pulse .6s steps(2, end) infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  /* 체력은 왼쪽 위, 인구는 오른쪽 위 — 상단 바와 겹치지 않게 내린다. */
  #hp, #pop {
    position: absolute; top: 48px; z-index: 5;
    display: flex; align-items: center; gap: 6px; height: 25px; padding: 0 11px;
    background: var(--plate); box-shadow: inset 0 0 0 1px var(--edge);
    font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px;
    text-shadow: 0 1px 3px #000;
  }
  #hp { left: 8px; color: var(--hp); }
  #pop { right: 8px; }
  #hp::before { content: '♥'; }
  #pop::after { content: '배치'; font-size: 10px; font-weight: 600; color: var(--dim); }
  #pop.full { color: var(--sell); }

  /* ── 좌측: 시너지 ──────────────────────────────────── */
  #traits {
    position: absolute; left: 8px; top: 80px; width: 148px;
    max-height: calc(100% - 96px);
    display: flex; flex-direction: column; gap: 3px; z-index: 4;
    overflow-y: auto; pointer-events: none;
  }
  .trait {
    pointer-events: auto;
    flex: none;
    display: flex; align-items: center; gap: 6px; height: 25px; padding: 0 10px 0 3px;
    background: var(--plate); box-shadow: inset 0 0 0 1px var(--edge);
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--skew)) 100%, 0 100%);
    font-size: 13px; color: #e6e0f0; text-shadow: 0 1px 2px #000a;
  }
  .trait .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trait .c { font-variant-numeric: tabular-nums; font-size: 12px; color: #9c94ad; }
  .trait.off { opacity: .5; }
  /* 육각 배지 + 등급색. 배지 안에는 시너지 이름 첫 글자 — 전용 아이콘이
     없으므로 글자가 곧 표식이다. */
  .trait .pip {
    width: 21px; height: 24px; flex: none; display: grid; place-items: center;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: #3b3550; color: #0f0d16; font-size: 12px; font-weight: 800; line-height: 1;
  }
  .trait.s1 .pip { background: linear-gradient(#d99154, #a5602c); }
  .trait.s2 .pip { background: linear-gradient(#e6edf5, #a8b4c4); }
  .trait.s3 .pip { background: linear-gradient(#ffe08a, #d9a12c); }
  .trait.s1 .c { color: #e8a05c; }
  .trait.s2 .c { color: #dfe7f0; }
  .trait.s3 .c { color: var(--gold); }

  /* ── 우측: 플레이어 ────────────────────────────────── */
  /* 8행이 세로를 다 먹는다. 행을 낮추고 넘치면 스크롤 — 등수는 위쪽이 중요하다. */
  #lobby {
    position: absolute; right: 8px; top: 80px; width: 152px; z-index: 4;
    max-height: calc(100% - 96px);
    display: flex; flex-direction: column; gap: 2px;
    overflow-y: auto;
  }
  .seat {
    flex: none;
    display: flex; align-items: center; gap: 6px; height: 25px; padding: 0 3px 0 10px;
    background: var(--plate); box-shadow: inset 0 0 0 1px var(--edge);
    clip-path: polygon(var(--skew) 0, 100% 0, 100% 100%, 0 100%);
    font-size: 12px; color: #e6e0f0; text-shadow: 0 1px 2px #000a; cursor: pointer;
  }
  .seat .rk { width: 12px; font-size: 10px; color: #8d85a0; text-align: right; }
  .seat .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat .h { font-variant-numeric: tabular-nums; font-weight: 800; color: #ff8a95; font-size: 12px; }
  /* 오른쪽 끝 원형 표식 — TFT 의 초상화 자리다. */
  .seat .av {
    width: 19px; height: 19px; flex: none; border-radius: 50%;
    display: grid; place-items: center; font-size: 10px; font-weight: 800;
    background: #3b3550; color: #0f0d16;
  }
  .seat.me { box-shadow: inset 0 0 0 1px var(--gold); }
  .seat.me .n { color: var(--gold); font-weight: 800; }
  .seat.me .av { background: linear-gradient(#ffe08a, #d9a12c); }
  .seat.foe { box-shadow: inset 0 0 0 1px var(--team-b); }
  .seat.foe .av { background: linear-gradient(#ff9a8c, #d9503c); }
  .seat.out { opacity: .35; }
  .seat.out .h { color: #6c6579; }
  .seat.open { background: #2a2440f0; box-shadow: inset 0 0 0 1px #6f7fd8; }

  /* ── 상세 패널 ─────────────────────────────────────── */
  .panel {
    position: absolute; z-index: 8; border-radius: 5px; overflow: hidden;
    background: #12101cf5; box-shadow: inset 0 0 0 1px var(--pc, #6f7fd8), 0 6px 18px #000a;
    font-size: 12px; color: #e6e0f0;
  }
  .panel[hidden] { display: none; }

  #info { right: 166px; top: 80px; width: 200px; --pc: var(--tc, #6f7fd8); }
  #info .hd {
    display: flex; align-items: center; gap: 7px; padding: 6px 8px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 45%, transparent), transparent);
  }
  #info .hd img { width: 34px; height: 34px; object-fit: contain; flex: none; }
  #info .hd .t { flex: 1; min-width: 0; }
  #info .hd .nm { font-weight: 800; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #info .hd .sub { font-size: 10px; color: #a79fbb; }
  #info .hd .st { color: var(--sc); font-size: 13px; letter-spacing: -1px; }
  #info .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px;
    padding: 6px 8px; border-top: 1px solid var(--edge); font-variant-numeric: tabular-nums;
  }
  #info .grid span { color: #9c94ad; }
  #info .grid b { float: right; font-weight: 700; color: #f0ecf8; }
  #info .sk { padding: 6px 8px; border-top: 1px solid var(--edge); line-height: 1.4; color: #d5cee6; }
  #info .sk em { color: var(--xp); font-style: normal; font-weight: 700; }
  #info .sell { padding: 5px 8px; border-top: 1px solid var(--edge); color: #a79fbb; font-size: 10px; }
  #info .sell b { color: var(--gold); }

  #traitinfo { left: 162px; top: 80px; width: 214px; }
  #traitinfo .hd {
    display: flex; align-items: center; gap: 7px; padding: 6px 9px;
    background: #2a2440; font-weight: 800; font-size: 13px;
  }
  #traitinfo .hd .c { margin-left: auto; color: var(--gold); font-variant-numeric: tabular-nums; }
  #traitinfo .steps { padding: 5px 9px; display: flex; flex-direction: column; gap: 3px; }
  #traitinfo .step { display: flex; gap: 7px; line-height: 1.35; opacity: .45; }
  #traitinfo .step.on { opacity: 1; }
  #traitinfo .step b { flex: none; width: 16px; text-align: right; color: #9c94ad; }
  #traitinfo .step.on b { color: var(--gold); }
  #traitinfo .mem { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 9px; border-top: 1px solid var(--edge); }
  #traitinfo .mem figure { width: 36px; text-align: center; }
  #traitinfo .mem img {
    width: 34px; height: 34px; object-fit: contain; display: block; border-radius: 4px;
    background: #ffd16626; box-shadow: inset 0 0 0 1px #ffd16688;
  }
  #traitinfo .mem figcaption {
    font-size: 8px; line-height: 1.1; color: #b7afc8; margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #traitinfo .mem figure.no img {
    filter: grayscale(1) brightness(.45);
    background: #ffffff08; box-shadow: inset 0 0 0 1px var(--edge);
  }
  #traitinfo .mem figure.no figcaption { color: #6c6579; }

  #peek {
    position: absolute; left: 50%; top: 80px; transform: translateX(-50%); z-index: 9;
    display: flex; align-items: center; gap: 10px; padding: 5px 14px;
    background: #2a2440f2; box-shadow: inset 0 0 0 1px #6f7fd8;
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 100%, 0 100%);
    font-size: 13px; font-weight: 700;
  }
  #peek[hidden] { display: none; }
  #peek button { font-size: 11px; padding: 2px 9px; background: #4a4270; color: #fff; border-radius: 3px; }

  #hint {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 9;
    padding: 5px 14px; border-radius: 20px;
    background: rgba(0,0,0,.78); color: var(--ink); font-size: 12px;
    pointer-events: none; opacity: 0; transition: opacity .18s;
  }
  #hint.show { opacity: 1; }

  /* ── 하단 바 ───────────────────────────────────────── */
  #shopbar {
    flex: none; height: var(--shopH); display: flex; align-items: stretch; gap: 8px;
    padding: 7px 10px;
    background: linear-gradient(#161326, #0e0c18);
    box-shadow: inset 0 1px 0 #ffffff14;
    transition: filter .12s;
  }
  #shopbar.selling { filter: hue-rotate(-25deg) saturate(1.8) brightness(1.15); }

  /* 좌측: 레벨 · XP · 티어 확률 · 구매/새로고침/잠금 */
  #levelbox { width: 232px; flex: none; display: flex; flex-direction: column; gap: 4px; }
  #lvline { display: flex; align-items: center; gap: 7px; }
  #lvl { font-size: 19px; font-weight: 800; color: var(--gold); line-height: 1; }
  #lvl::after { content: '레벨'; font-size: 11px; font-weight: 600; color: var(--dim); margin-left: 2px; }
  #xptext { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #xpbar { flex: 1; height: 6px; border-radius: 3px; background: #00000066; overflow: hidden; box-shadow: inset 0 0 0 1px var(--edge); }
  #xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3aa0d8, var(--xp)); }

  /* 티어 확률. 지금 레벨에서 무엇이 나오는지가 안 보이면 레벨업 판단을 못 한다. */
  #odds { display: flex; gap: 3px; }
  #odds span {
    flex: 1; text-align: center; padding: 2px 0; border-radius: 3px;
    font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: #0e0c18; background: var(--oc);
  }
  #odds span.zero { color: #5b5468; background: #ffffff10; }

  #lvbtns { display: flex; gap: 5px; margin-top: auto; }
  .btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; padding: 5px 0; border-radius: 4px;
    background: #262133; box-shadow: inset 0 0 0 1px var(--edge);
    font-size: 11px; line-height: 1.15;
  }
  .btn b { font-size: 12px; }
  .btn .cost { color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { filter: grayscale(.7) brightness(.62); cursor: default; }
  #lock.on { background: #4a3a12; box-shadow: inset 0 0 0 1px var(--gold); }
  #lock.on b { color: var(--gold); }

  /* 상점 카드 */
  #shop { flex: 1; display: flex; gap: 6px; min-width: 0; }
  .card {
    --tc: var(--t1);
    flex: 1; min-width: 0; position: relative; overflow: hidden; border-radius: 5px;
    background:
      radial-gradient(120% 74% at 50% 16%, color-mix(in srgb, var(--tc) 36%, transparent), transparent 72%),
      linear-gradient(#2b2536, #191322);
    box-shadow: inset 0 0 0 1px var(--tc), 0 2px 6px #0006;
  }
  .card.empty {
    --tc: #46405a;
    background: repeating-linear-gradient(45deg, #1a1622 0 6px, #171320 6px 12px);
    opacity: .5;
  }
  .card:not(.empty):active { transform: translateY(1px); }
  .card.poor { filter: grayscale(.5) brightness(.7); }
  .card .art { position: absolute; left: 0; right: 0; top: 0; bottom: 22px; display: grid; place-items: center; }
  .card .art img {
    width: 100%; height: 100%; object-fit: contain; transform: scale(1.24);
    filter: drop-shadow(0 3px 5px #000a);
  }
  /* 시너지는 TFT 처럼 좌상단에 줄로 세운다 — 이름띠 위에 붙이면 자리가 없다. */
  .card .tr {
    position: absolute; left: 6px; top: 4px; display: flex; flex-direction: column; gap: 1px;
    font-size: 10px; line-height: 1.25; color: #ded6ee; text-shadow: 0 1px 3px #000, 0 0 6px #000;
  }
  .card .nm {
    position: absolute; left: 0; right: 0; bottom: 0; height: 22px;
    display: flex; align-items: center; padding: 0 6px;
    background: var(--tc); color: #14101c;
    font-size: 13px; font-weight: 800; letter-spacing: -.3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .pr {
    position: absolute; right: 5px; bottom: 25px; z-index: 2;
    display: flex; align-items: center; gap: 3px;
    padding: 1px 6px 1px 4px; border-radius: 9px;
    background: #12101cee; box-shadow: inset 0 0 0 1px #6b5230;
    font-size: 12px; color: var(--gold); font-weight: 800;
  }
  .card .pr::before {
    content: ''; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #c9932c);
  }

  /* 우측: 골드 · 전투 */
  #rightbox { width: 110px; flex: none; display: flex; flex-direction: column; gap: 5px; }
  #gold {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 40px; border-radius: 4px;
    background: #2a2010; box-shadow: inset 0 0 0 1px #6b5230;
    font-size: 22px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums;
  }
  #gold::before {
    content: ''; width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #c9932c);
  }
  #fight {
    flex: 1; border-radius: 4px; font-weight: 800; font-size: 15px; color: #f6ffe8;
    background: linear-gradient(#3d8a5e, #2a6342); box-shadow: inset 0 0 0 1px #58b184;
  }
  #fight:active { transform: translateY(1px); }
  #fight:disabled { filter: grayscale(.75) brightness(.6); cursor: default; }

  /* ── 전투 조작 ─────────────────────────────────────── */
  #bspeed {
    position: absolute; right: 8px; bottom: 8px; z-index: 6;
    min-width: 48px; padding: 6px 11px; border-radius: 4px;
    background: #262133e8; box-shadow: inset 0 0 0 1px var(--edge);
    font-size: 13px; font-weight: 700;
  }
  #bspeed[hidden] { display: none; }
  #alive {
    position: absolute; left: 50%; top: 48px; transform: translateX(-50%); z-index: 5;
    font-weight: 800; font-size: 15px; text-shadow: 0 1px 3px #000;
  }
  .teamA { color: var(--team-a); }
  .teamB { color: var(--team-b); }

  /* ── 드래그 유령 ───────────────────────────────────── */
  #ghost {
    position: fixed; width: 56px; height: 56px; pointer-events: none;
    z-index: 50; display: none; transform: translate(-50%, -62%);
  }
  #ghost img { width: 100%; height: 100%; object-fit: contain; }
  #ghost.sell { filter: drop-shadow(0 0 7px var(--sell)); }

  #rotate {
    display: none; position: fixed; inset: 0; z-index: 90;
    background: var(--bg); color: var(--dim);
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  @media (orientation: portrait) { #rotate { display: flex; } }

  #boot {
    position: fixed; inset: 0; z-index: 80;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--dim);
  }
</style>
</head>
<body>
  <div id="prep" class="screen" hidden>
    <div id="stage">
      <div id="top">
        <div id="topbar">
          <span id="roundtag">1-1</span>
          <span id="track"></span>
          <span id="timer">30</span>
        </div>
      </div>
      <span id="hp">40</span>
      <span id="pop">0 / 3</span>
      <span id="alive"></span>

      <div id="traits"></div>
      <div id="lobby"></div>

      <div id="info" class="panel" hidden></div>
      <div id="traitinfo" class="panel" hidden></div>
      <div id="peek" hidden></div>
      <div id="hint"></div>
      <button id="bspeed" hidden>1x</button>
    </div>

    <div id="shopbar">
      <div id="levelbox">
        <div id="lvline">
          <span id="lvl">3</span>
          <span id="xpbar"><i></i></span>
          <span id="xptext">0/2</span>
        </div>
        <div id="odds"></div>
        <div id="lvbtns">
          <button class="btn" id="buyxp"><b>경험치</b><span class="cost">4</span></button>
          <button class="btn" id="reroll"><b>새로고침</b><span class="cost">2</span></button>
          <button class="btn" id="lock"><b>잠금</b><span class="cost">−</span></button>
        </div>
      </div>

      <div id="shop"></div>

      <div id="rightbox">
        <div id="gold"><span id="goldval">0</span></div>
        <button id="fight">전투 시작</button>
      </div>
    </div>
  </div>
