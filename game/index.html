<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Reroll Beasts</title>
<style>
  /* ─────────────────────────────────────────────────────────
     TFT 배치를 따른다. 판이 화면의 주인이고 HUD 는 그 위에 뜬다.

     이 UI 의 뼈대는 **비스듬한 판(평행사변형)** 이다. TFT 의 시너지 줄과
     플레이어 줄이 전부 그 모양이고, 직사각형 목록과는 인상이 완전히 다르다.
     clip-path 로 자른다 — border-radius 로는 못 만드는 각이다.

     세로가 390px 뿐이라 상단·좌우를 띠로 쌓지 않고 판 위에 겹친다.
     ───────────────────────────────────────────────────────── */
  :root {
    --bg: #0e1220;
    --ink: #f3ecdd;
    --dim: #a9a08f;
    --gold: #ffd166;
    --hp: #ff6b7a;
    --xp: #6fd8ff;
    --team-a: #5ff0e0;
    --team-b: #ff7a6f;
    --sell: #e8654f;
    --t1: #9aa3b2; --t2: #4fb96a; --t3: #4f8fe8; --t4: #b06fe8; --t5: #e8b34f;
    --plate: #12101ce8;
    --edge: #ffffff1c;

    --shopH: 92px;
    /* 비스듬한 판의 기울기. 한 곳에서 정해야 좌우가 대칭으로 보인다. */
    --skew: 9px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  ::-webkit-scrollbar { display: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  img { image-rendering: pixelated; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .screen[hidden] { display: none; }

  /* ── 무대 ──────────────────────────────────────────── */
  #stage {
    flex: 1; min-height: 0; position: relative; overflow: hidden;
    background: radial-gradient(130% 100% at 50% 6%, #3a4d7d 0%, #1b2440 50%, #0d1120 100%);
  }
  #stage canvas { display: block; position: relative; }

  /* 9-슬라이스 도우미. 원본 32px, 테두리 6px.
     테두리가 좌우 2×BW · 상하 2×BW 를 먹으므로 크기를 잡을 때 그만큼 더한다. */
  .n9 {
    border-style: solid; border-width: var(--bw, 10px);
    border-image-slice: 6 fill; border-image-repeat: repeat;
    image-rendering: pixelated;
  }
  /* 3-슬라이스 가로 띠 (좌·중·우 이미지가 따로다) */
  .h3 {
    border-style: solid; border-width: 0 var(--bw, 9px);
    border-image-slice: 0 9 0 9 fill;
    image-rendering: pixelated;
  }

  /* ── 상단: 라운드 · 라운드 종류 트랙 · 남은 시간 ───── */
  #top {
    position: absolute; top: 0; left: 0; right: 0; height: 46px; z-index: 5;
    display: flex; align-items: flex-start; justify-content: center;
    pointer-events: none;
  }
  #topbar {
    display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 2px;
    border-style: solid; border-width: 8px; border-image-slice: 6 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    image-rendering: pixelated;
  }
  #roundtag {
    display: flex; align-items: center; height: 30px; padding: 0 4px;
    font-size: 16px; font-weight: 800; letter-spacing: .5px; color: #fff2e0;
    text-shadow: 0 1px 2px #0009;
    border-style: solid; border-width: 6px; border-image-slice: 6 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/banner_m.png');
    image-rendering: pixelated;
  }

  /* 라운드 종류 트랙. 마름모 = PvE, 원 = 상대. */
  #track { display: flex; gap: 5px; align-items: center; }
  #track i {
    width: 10px; height: 10px; display: block; border-radius: 50%;
    background: #00000055; box-shadow: inset 0 0 0 1px #ffffff2e;
  }
  #track i.pve { border-radius: 2px; transform: rotate(45deg); }
  #track i.done { background: #e8dcc0; }
  #track i.now { background: var(--gold); box-shadow: 0 0 9px var(--gold); transform: scale(1.3); }
  #track i.pve.now { transform: rotate(45deg) scale(1.3); }

  #timer {
    display: flex; align-items: center; gap: 5px; padding-right: 4px;
    font-variant-numeric: tabular-nums; font-weight: 800; font-size: 16px;
    min-width: 42px; justify-content: flex-end; color: #fff2e0;
    text-shadow: 0 1px 2px #0009;
  }
  #timer::before {
    content: ''; width: 12px; height: 12px; border-radius: 50%;
    box-shadow: inset 0 0 0 2px currentColor;
  }
  #timer.warn { color: #ff9a7a; animation: pulse .6s steps(2, end) infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  /* 체력·인구는 목재 판에 얹는다 */
  #hp {
    position: absolute; left: 8px; top: 50px; z-index: 5; line-height: 1;
    display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 2px;
    border-style: solid; border-width: 6px; border-image-slice: 6 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    image-rendering: pixelated;
    font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px;
    color: #ff8a95; text-shadow: 0 1px 2px #0009;
  }
  #hp::before { content: '♥'; }

  /* 인구는 상단 바 안으로. 우측 세로 자리는 플레이어 목록이 통째로 쓴다. */
  #pop {
    display: flex; align-items: center; gap: 4px;
    font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px;
    color: #f3ecdd; text-shadow: 0 1px 2px #0009;
  }
  #pop::before { content: '⬡'; font-size: 12px; opacity: .75; }
  #pop.full { color: #ffa08c; }

  /* ── 좌측: 시너지 ──────────────────────────────────── */
  #traits {
    position: absolute; left: 6px; top: 84px; width: 158px;
    max-height: calc(100% - 98px);
    display: flex; flex-direction: column; gap: 2px; z-index: 4;
    overflow-y: auto; pointer-events: none;
  }
  .trait {
    pointer-events: auto; flex: none; line-height: 1;
    display: flex; align-items: center; gap: 5px; height: 27px; padding: 0 3px 0 0;
    border-width: 5px;
    border-style: solid; border-width: 6px; border-image-slice: 6 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/plate_m.png');
    image-rendering: pixelated;
    font-size: 13px; color: #ffffff; text-shadow: 0 1px 2px #000, 0 0 3px #0009;
  }
  .trait .n { flex: 1; line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trait .c { font-variant-numeric: tabular-nums; font-size: 12px; color: #cbd4e2; }
  .trait.off { opacity: .45; }
  /* 육각 배지 + 등급색. 안에는 시너지 이름 첫 글자 — 전용 아이콘이 없으므로
     글자가 곧 표식이다. */
  .trait .pip {
    width: 19px; height: 22px; flex: none; display: grid; place-items: center;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: #4a4458; color: #0f0d16; font-size: 12px; font-weight: 800; line-height: 1;
  }
  .trait.s1 .pip { background: linear-gradient(#d99154, #a5602c); }
  .trait.s2 .pip { background: linear-gradient(#e6edf5, #a8b4c4); }
  .trait.s3 .pip { background: linear-gradient(#ffe08a, #d9a12c); }
  .trait.s1 .c { color: #f0b078; }
  .trait.s2 .c { color: #eef4ff; }
  .trait.s3 .c { color: var(--gold); }

  /* ── 우측: 플레이어 ────────────────────────────────── */
  /* 8명이 **전부** 보여야 한다. 스크롤에 밀리면 체력이 깎여 아래로 내려간
     내 줄이 화면 밖으로 나간다. */
  #lobby {
    position: absolute; right: 6px; top: 50px; width: 158px; z-index: 4;
    display: flex; flex-direction: column; gap: 1px;
  }
  .seat {
    flex: none; line-height: 1;
    display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 0 0 2px;
    border-width: 5px;
    border-style: solid; border-width: 6px; border-image-slice: 6 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/plate_m.png');
    image-rendering: pixelated;
    font-size: 11px; color: #ffffff; text-shadow: 0 1px 2px #000, 0 0 3px #0009; cursor: pointer;
  }
  .seat .rk { width: 11px; font-size: 10px; color: #cdd6e4; text-align: right; }
  .seat .n { flex: 1; line-height: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat .h { font-variant-numeric: tabular-nums; font-weight: 800; color: #ff9aa4; font-size: 11px; }
  .seat .av {
    width: 16px; height: 16px; flex: none; border-radius: 50%;
    display: grid; place-items: center; font-size: 10px; font-weight: 800;
    background: #4a4458; color: #0f0d16;
  }
  .seat.me { filter: saturate(1.5) brightness(1.15); }
  .seat.me .n { color: var(--gold); font-weight: 800; }
  .seat.me .av { background: linear-gradient(#ffe08a, #d9a12c); }
  .seat.foe .av { background: linear-gradient(#ff9a8c, #d9503c); }
  .seat.foe .n::after { content: ' ⚔'; color: #ff9a8c; }
  .seat.out { opacity: .35; }
  .seat.open { filter: brightness(1.35); }

  /* ── 상세 패널 ─────────────────────────────────────── */
  .panel {
    position: absolute; z-index: 8;
    border-style: solid; border-width: 12px; border-image-slice: 6 fill;
    border-image-repeat: repeat; image-rendering: pixelated;
    border-image-source: url('/assets/ui/panel_wood.png');
    filter: drop-shadow(0 5px 14px #000a);
    font-size: 12px; color: #f0e9dc;
  }
  .panel[hidden] { display: none; }

  #info { right: 166px; top: 80px; width: 200px; --pc: var(--tc, #6f7fd8); }
  #info .hd {
    display: flex; align-items: center; gap: 7px; padding: 2px 0 6px;
    border-bottom: 1px solid #00000040;
  }
  #info .hd img { width: 34px; height: 34px; object-fit: contain; flex: none; }
  #info .hd .t { flex: 1; min-width: 0; }
  #info .hd .nm { font-weight: 800; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #info .hd .sub { font-size: 10px; color: #b3a894; }
  #info .hd .st { color: var(--sc); font-size: 13px; letter-spacing: -1px; }
  #info .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px;
    padding: 6px 0; border-top: 1px solid #ffffff1a; font-variant-numeric: tabular-nums;
  }
  #info .grid span { color: #b3a894; }
  #info .grid b { float: right; font-weight: 700; color: #fff6e4; }
  #info .sk { padding: 6px 0; border-top: 1px solid #ffffff1a; line-height: 1.4; color: #e6dcc8; }
  #info .sk em { color: #8fd8ff; font-style: normal; font-weight: 700; }
  #info .sell { padding: 5px 0 0; border-top: 1px solid #ffffff1a; color: #b3a894; font-size: 10px; }
  #info .sell b { color: var(--gold); }

  #traitinfo { left: 162px; top: 80px; width: 214px; }
  #traitinfo .hd {
    display: flex; align-items: center; gap: 7px; padding: 2px 0 6px;
    border-bottom: 1px solid #00000040; font-weight: 800; font-size: 13px;
  }
  #traitinfo .hd .c { margin-left: auto; color: var(--gold); font-variant-numeric: tabular-nums; }
  #traitinfo .steps { padding: 6px 0; display: flex; flex-direction: column; gap: 3px; }
  #traitinfo .step { display: flex; gap: 7px; line-height: 1.35; opacity: .45; }
  #traitinfo .step.on { opacity: 1; }
  #traitinfo .step b { flex: none; width: 16px; text-align: right; color: #b3a894; }
  #traitinfo .step.on b { color: var(--gold); }
  #traitinfo .mem { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 0 0; border-top: 1px solid #ffffff1a; }
  #traitinfo .mem figure { width: 36px; text-align: center; }
  #traitinfo .mem img {
    width: 34px; height: 34px; object-fit: contain; display: block; border-radius: 4px;
    background: #ffd16626; box-shadow: inset 0 0 0 1px #ffd16688;
  }
  #traitinfo .mem figcaption {
    font-size: 8px; line-height: 1.1; color: #cfc4ac; margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #traitinfo .mem figure.no img {
    filter: grayscale(1) brightness(.45);
    background: #ffffff08; box-shadow: inset 0 0 0 1px var(--edge);
  }
  #traitinfo .mem figure.no figcaption { color: #7a7160; }

  #peek {
    position: absolute; left: 50%; top: 80px; transform: translateX(-50%); z-index: 9;
    display: flex; align-items: center; gap: 10px; padding: 5px 14px;
    border-style: solid; border-width: 10px; border-image-slice: 6 fill;
    border-image-repeat: repeat; image-rendering: pixelated;
    border-image-source: url('/assets/ui/panel_wood.png');
    font-size: 13px; font-weight: 700; color: #f0e9dc;
  }
  #peek[hidden] { display: none; }
  #peek button {
    font-size: 11px; padding: 3px 6px; color: #f3ecdd;
    border-style: solid; border-width: 8px; border-image-slice: 6 fill;
    border-image-source: url('/assets/ui/button.png'); image-rendering: pixelated;
  }

  #hint {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 9;
    padding: 5px 14px; border-radius: 20px;
    background: rgba(0,0,0,.78); color: var(--ink); font-size: 12px;
    pointer-events: none; opacity: 0; transition: opacity .18s;
  }
  #hint.show { opacity: 1; }

  /* ── 정보 줄 (판 위에 뜬다) ────────────────────────── */
  /* 레벨 · 확률 · 골드 · 연승 · 잠금은 **상점 판 안에 넣지 않는다.**
     같은 갈색 판에 묶으면 "상점의 일부"로 읽히는데, 이건 내 상태지
     상점 물건이 아니다. 판 위에 각자 자기 틀을 쓰고 뜬다. */
  /* 좌 · 중 · 우 세 칸. flex 로 늘어놓으면 왼쪽 것들 폭에 따라 골드가 흔들린다 —
     골드는 화면 정가운데에 고정돼야 눈이 매번 같은 자리를 본다. */
  /* 무대 안에 띄우면 3D 대기석을 덮는다. 무대와 상점 판 **사이**의 제 줄이다.
     상점 판(갈색) 안에는 넣지 않는다 — 이건 내 상태지 상점 물건이 아니다. */
  #hudbar {
    flex: none; height: 42px; padding: 0 6px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  }
  #hudL { display: flex; align-items: center; gap: 6px; justify-self: start; }
  #hudR { display: flex; align-items: center; gap: 6px; justify-self: end; }

  /* panel_dark 는 금속 모서리쇠와 **가운데 판자 이음선**이 있는 궤짝이다.
     38px 높이에서는 그 이음선이 글자 한가운데를 가로지르고 모서리쇠가
     양끝을 먹어, 숫자가 아니라 상자가 먼저 읽힌다. 무늬 없는 판으로 바꾼다.
     차가운 강철 = 내 상태(레벨·연승), 따뜻한 나무 = 재화(골드). */
  #lvbox {
    display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 6px;
    border-style: solid; border-width: 6px; border-image-slice: 6 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_steel.png');
    image-rendering: pixelated;
  }
  #lvl { font-size: 17px; font-weight: 800; color: #1d2a3d; line-height: 24px; white-space: nowrap; }
  #lvl::after { content: '레벨'; font-size: 11px; font-weight: 600; color: #46586f; margin-left: 2px; }
  /* 한 줄로 눕힌다. 22px 안쪽에 두 줄을 넣으면 9px 글자가 되어 안 읽힌다. */
  #xprow { display: flex; align-items: center; }
  /* 막대는 뺐다. 0% 일 때 가운데를 가로지르는 선으로만 읽힌다. */
  #xpbar { display: none; }
  #xptext {
    font-size: 13px; line-height: 24px; color: #1a4a78; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  #xptext::before { content: 'XP '; font-size: 10px; color: #46586f; font-weight: 600; }

  /* 티어 확률. 참고용 숫자다 — 크게 잡으면 상점 카드보다 눈에 먼저 든다. */
  #odds { display: flex; gap: 2px; }
  #odds span {
    width: 28px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 2px; font-size: 11px; font-weight: 800;
    font-variant-numeric: tabular-nums; color: #12100c; background: var(--oc);
    box-shadow: 0 1px 3px #0007;
  }
  #odds span.zero { color: #8a8272; background: #1a1710e0; }

  #gold {
    line-height: 24px;
    display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 10px;
    border-style: solid; border-width: 6px; border-image-slice: 6 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    image-rendering: pixelated;
    font-size: 19px; font-weight: 800; color: #ffe9a8; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px #00000090;
  }
  #gold::before {
    content: ''; width: 15px; height: 15px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #c9932c);
  }

  /* 연승·연패. 다음 라운드 수입이 이걸로 갈리는데 화면에 없었다. */
  #streak {
    line-height: 16px;
    display: flex; align-items: center; gap: 5px; height: 38px; padding: 0 8px;
    border-style: solid; border-width: 6px; border-image-slice: 6 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_steel.png');
    image-rendering: pixelated;
    font-size: 11px; font-weight: 700; white-space: nowrap; color: #1d2a3d;
  }
  #streak b { font-variant-numeric: tabular-nums; font-size: 13px; }
  #streak.win b { color: #14733f; }
  #streak.lose b { color: #9c2436; }

  #lock {
    line-height: 16px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    width: 78px; height: 38px;
    border-style: solid; border-width: 6px; border-image-slice: 6 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/button.png');
    image-rendering: pixelated;
    font-size: 11px; font-weight: 700; color: #f3ecdd; text-shadow: 0 1px 2px #0009;
  }
  #lock .st { font-size: 9px; opacity: .75; }
  #lock.on { border-image-source: url('/assets/ui/button_light.png'); color: #5a4212; }
  #lock.on .st { opacity: 1; }

  /* ── 상점 판 ───────────────────────────────────────── */
  /* 이 판에는 **살 것만** 들어간다. 카드와 그걸 굴리는 버튼 둘. */
  #shopbar {
    flex: none; height: var(--shopH);
    display: flex; align-items: stretch; gap: 6px;
    border-style: solid; border-width: 12px; border-image-slice: 6 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    image-rendering: pixelated;
    transition: filter .12s;
  }
  #shopbar.selling { filter: hue-rotate(-25deg) saturate(1.8) brightness(1.15); }

  #sidebtns { width: 124px; flex: none; display: flex; flex-direction: column; gap: 5px; }
  .btn {
    flex: 1; line-height: 1;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border-style: solid; border-width: 6px; border-image-slice: 6 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/button.png');
    image-rendering: pixelated;
    font-size: 12px; font-weight: 700; color: #f3ecdd; text-shadow: 0 1px 2px #0009;
  }
  .btn .cost {
    display: flex; align-items: center; gap: 3px;
    color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .btn .cost::before {
    content: ''; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #c9932c);
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { filter: grayscale(.7) brightness(.62); cursor: default; }

  /* 정사각. 가로로 길면 초상화가 납작해져 무슨 몬스터인지 안 읽힌다.
     남는 폭은 가운데 정렬로 흘린다 — 늘려서 채우면 다시 직사각이 된다. */
  #shop { flex: 1; display: flex; gap: 5px; min-width: 0; }

  /* 카드. 나무 액자를 두르지 않는다 — 6px 9-슬라이스가 사방을 먹어
     78px 카드에서 실제 그림 자리가 66px 밖에 안 남았다. 대신 **아트가 카드
     전체를 채우고**, 정보는 그 위에 얹는다:
       좌상단  특성 두 줄 (어두운 스크림 위)
       하단 띠  이름 왼쪽 · 값 오른쪽, 띠 색이 곧 티어
     참고한 오토체스 상점이 쓰는 배치다. 액자 대신 티어색이 테두리 노릇을 한다. */
  .card {
    --tc: var(--t1);
    flex: 1; min-width: 0; position: relative; overflow: hidden;
    border-radius: 3px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 26%, #15121d), #0c0a12);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 45%, transparent), 0 2px 5px #000a;
  }
  /* 위쪽 후광. 어두운 모델이 어두운 판에 묻히는 걸 막는다. */
  .card::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 72% at 50% 4%, color-mix(in srgb, var(--tc) 46%, transparent), transparent 76%);
  }
  .card.empty { --tc: #6a6252; opacity: .28; }
  .card.empty::before { display: none; }
  .card:not(.empty):active { transform: translateY(1px); }
  .card.poor { filter: grayscale(.55) brightness(.7); }

  .card .art { position: absolute; left: 0; right: 0; top: 0; bottom: 18px; z-index: 1; }
  .card .art img {
    width: 100%; height: 100%; object-fit: contain;
    /* 그림 자리는 128×50 인데 섬네일은 정사각이다 — contain 이면 세로에 맞춰
       50px 폭만 쓰고 좌우 78px 이 통째로 빈다. 키워서 넘치게 두고 카드가
       잘라 낸다 (참고한 상점도 아트를 잘라 쓴다). 발밑은 이름띠가 덮는다. */
    transform: scale(1.62) translateY(6%);
    filter: drop-shadow(0 3px 5px #000b);
  }

  /* 특성은 좌상단에 세로로. 아트 위에 바로 얹으면 밝은 모델에서 글자가 사라져
     스크림을 깐다 — 왼쪽만 어둡게, 오른쪽으로 사라지는 그라디언트. */
  .card .tr {
    position: absolute; left: 0; top: 0; z-index: 2;
    display: flex; flex-direction: column;
    padding: 2px 10px 3px 3px;
    background: linear-gradient(100deg, #000000b8 0%, #00000078 58%, #0000 100%);
    font-size: 9px; line-height: 11px; font-weight: 700; color: #e4dff2;
  }
  .card .tr i {
    display: flex; align-items: center; gap: 3px; font-style: normal;
    white-space: nowrap;
  }
  .card .tr i::before {
    content: ''; flex: none; width: 5px; height: 6px; background: #d3cade;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }

  /* 하단 띠 = 이름 + 값. 티어색이 여기에만 진하게 들어간다. */
  .card .nm {
    position: absolute; left: 0; right: 0; bottom: 0; height: 18px; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    padding: 0 4px;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--tc) 66%, #0c0a12),
      color-mix(in srgb, var(--tc) 42%, #0c0a12));
    box-shadow: inset 0 1px 0 #ffffff2e;
    font-size: 11px; line-height: 18px; font-weight: 800; color: #fff;
    text-shadow: 0 1px 2px #000a;
  }
  .card .nm b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .pr {
    flex: none; display: flex; align-items: center; gap: 2px;
    color: #ffe6a8; font-variant-numeric: tabular-nums;
  }
  .card .pr::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #c9932c);
  }

  /* ── 전투 조작 ─────────────────────────────────────── */
  #bspeed {
    position: absolute; right: 8px; bottom: 8px; z-index: 6;
    min-width: 30px; padding: 4px 2px; color: #f3ecdd;
    border-style: solid; border-width: 10px; border-image-slice: 6 fill;
    border-image-source: url('/assets/ui/button.png'); image-rendering: pixelated;
    font-size: 13px; font-weight: 700; text-shadow: 0 1px 2px #0009;
  }
  #bspeed[hidden] { display: none; }
  #alive {
    position: absolute; left: 50%; top: 48px; transform: translateX(-50%); z-index: 5;
    font-weight: 800; font-size: 15px; text-shadow: 0 1px 3px #000;
  }
  .teamA { color: var(--team-a); }
  .teamB { color: var(--team-b); }

  /* ── 드래그 유령 ───────────────────────────────────── */
  #ghost {
    position: fixed; width: 56px; height: 56px; pointer-events: none;
    z-index: 50; display: none; transform: translate(-50%, -62%);
  }
  #ghost img { width: 100%; height: 100%; object-fit: contain; }
  #ghost.sell { filter: drop-shadow(0 0 7px var(--sell)); }

  #rotate {
    display: none; position: fixed; inset: 0; z-index: 90;
    background: var(--bg); color: var(--dim);
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  @media (orientation: portrait) { #rotate { display: flex; } }

  #boot {
    position: fixed; inset: 0; z-index: 80;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--dim);
  }
</style>
</head>
<body>
  <div id="prep" class="screen" hidden>
    <div id="stage">
      <div id="top">
        <div id="topbar" class="n9">
          <span id="roundtag" class="h3">1-1</span>
          <span id="track"></span>
          <span id="timer">30</span>
          <span id="pop">0/3</span>
        </div>
      </div>
      <span id="hp">40</span>
      <span id="alive"></span>

      <div id="traits"></div>
      <div id="lobby"></div>

      <div id="info" class="panel" hidden></div>
      <div id="traitinfo" class="panel" hidden></div>
      <div id="peek" hidden></div>
      <div id="hint"></div>
      <button id="bspeed" hidden>1x</button>

    </div>

    <div id="hudbar">
      <div id="hudL">
        <div id="lvbox">
          <span id="lvl">3</span>
          <span id="xprow"><span id="xpbar"><i></i></span><span id="xptext">0/2</span></span>
        </div>
        <div id="odds"></div>
      </div>
      <div id="gold"><span id="goldval">0</span></div>
      <div id="hudR">
        <div id="streak"></div>
        <button id="lock"><b>잠금</b><span class="st">해제</span></button>
      </div>
    </div>

    <div id="shopbar">
      <div id="sidebtns">
        <button class="btn" id="buyxp">경험치 구매<span class="cost">4</span></button>
        <button class="btn" id="reroll">새로고침<span class="cost">2</span></button>
      </div>
      <div id="shop"></div>
    </div>
  </div>

  <div id="ghost"><img alt="" /></div>
  <div id="rotate">가로로 돌려주세요</div>
  <div id="boot">불러오는 중…</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
