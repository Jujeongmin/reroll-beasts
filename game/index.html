<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Reroll Beasts</title>
<style>
  /* ─────────────────────────────────────────────────────────
     TFT 배치를 따른다. 판이 화면의 주인이고 HUD 는 그 위에 뜬다.

     이 UI 의 뼈대는 **비스듬한 판(평행사변형)** 이다. TFT 의 시너지 줄과
     플레이어 줄이 전부 그 모양이고, 직사각형 목록과는 인상이 완전히 다르다.
     clip-path 로 자른다 — border-radius 로는 못 만드는 각이다.

     세로가 390px 뿐이라 상단·좌우를 띠로 쌓지 않고 판 위에 겹친다.
     ───────────────────────────────────────────────────────── */
  :root {
    --bg: #0e1220;
    --ink: #f3ecdd;
    --dim: #a9a08f;
    --gold: #ffd166;
    --hp: #ff6b7a;
    --xp: #6fd8ff;
    --team-a: #5ff0e0;
    --team-b: #ff7a6f;
    --sell: #e8654f;
    --t1: #9aa3b2; --t2: #4fb96a; --t3: #4f8fe8; --t4: #b06fe8; --t5: #e8b34f;
    --plate: #12101ce8;
    --edge: #ffffff1c;

    --shopH: 100px;
    /* 비스듬한 판의 기울기. 한 곳에서 정해야 좌우가 대칭으로 보인다. */
    --skew: 9px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  ::-webkit-scrollbar { display: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  img { image-rendering: pixelated; }

  /* ── 반응형 ────────────────────────────────────────
     기준 화면은 812×390 (가로 든 휴대폰) 이다. 여기 맞춰 잰 값이 수십 개라
     화면 크기마다 다시 재기보다, **판 하나를 통째로 확대·축소**한다.
     세로는 390 으로 고정하고 가로만 실제 화면비를 따라가므로 (범위 안에서)
     레터박스 없이 꽉 찬다. 크기는 JS 가 매 resize 마다 넣는다. */
  #viewport {
    position: fixed; left: 50%; top: 50%;
    transform-origin: 50% 50%;
  }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .screen[hidden] { display: none; }

  /* ── 무대 ──────────────────────────────────────────── */
  #stage {
    flex: 1; min-height: 0; position: relative; overflow: hidden;
    background: radial-gradient(130% 100% at 50% 6%, #3a4d7d 0%, #1b2440 50%, #0d1120 100%);
  }
  #stage canvas { display: block; position: relative; }

  /* 9-슬라이스 도우미. 원본 32px, 테두리 6px.
     테두리가 좌우 2×BW · 상하 2×BW 를 먹으므로 크기를 잡을 때 그만큼 더한다. */
  /* 금화. 값이 골드라는 걸 아이콘 하나로 말한다 — 쓰는 곳마다 다시 그리지 않게
     여기 한 번만 적는다. */
  .coin {
    background: url('/assets/ui/coin.png') center / contain no-repeat;
    image-rendering: pixelated;
  }

  .n9 {
    border-style: solid; border-width: var(--bw, 10px);
    border-image-slice: 6; border-image-repeat: repeat;
    image-rendering: pixelated;
  }
  /* 3-슬라이스 가로 띠 (좌·중·우 이미지가 따로다) */
  .h3 {
    border-style: solid; border-width: 0 var(--bw, 9px);
    border-image-slice: 0 9 0 9 fill;
    image-rendering: pixelated;
  }

  /* ── 상단: 라운드 · 라운드 종류 트랙 · 남은 시간 ───── */
  /* 판 위에 뜨는 띠다. 여기 있는 건 전부 **참고값**(몇 라운드째 · 남은 시간 ·
     몇 마리 놓았나)이라, 크면 정작 판을 가린다. 화면 폭이 700~1040 사이에서
     변하므로 가운데 정렬로만 잡는다 — 좌우 어디에도 붙이지 않는다. */
  #top {
    position: absolute; top: 4px; left: 0; right: 0; z-index: 5;
    display: flex; align-items: flex-start; justify-content: center;
    pointer-events: none;
  }
  #topwrap {
    max-width: calc(100% - 24px); min-width: 0;
    display: flex; flex-direction: column; align-items: stretch;
  }
  /* 남은 시간 막대. 숫자만 있으면 "많이 남았나"를 매번 읽어서 계산해야 한다.
     띠 바로 밑에 깔아 상단 묶음이 한 덩어리로 읽히게 한다. */
  #timebar {
    height: 5px; margin: -3px 7px 0; border-radius: 3px; overflow: hidden;
    display: flex; justify-content: flex-end;
    background: #0b0f1eb0; box-shadow: inset 0 0 0 1px #ffffff26;
  }
  /* 가득 찬 상태에서 시작해 **빈 칸이 좌 → 우로** 밀고 들어온다.
     그래서 칠한 쪽을 오른쪽에 붙인다 (justify-content: flex-end).
     색은 남은 비율로 JS 가 섞는다. */
  #timebar i { display: block; height: 100%; width: 100%; }
  #timebar.warn i { animation: pulse .6s steps(2, end) infinite; }

  #topbar {
    min-width: 0;
    display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 3px;
    border-style: solid; border-width: 6px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    background: #c58747;
    image-rendering: pixelated;
  }
  /* 액자 안에 액자를 또 두르면 28px 짜리 띠가 통째로 테두리가 된다.
     라운드 번호는 색과 굵기로만 구분한다. */
  #roundtag {
    display: flex; align-items: center; flex: none;
    font-size: 14px; line-height: 16px; font-weight: 800; letter-spacing: .5px;
    color: var(--gold); text-shadow: 0 1px 2px #000, 0 0 4px #0009;
  }

  /* 라운드 종류 트랙. 마름모 = PvE, 원 = 상대. */
  /* 이번 스테이지의 라운드 점열. 원 = 대결, 마름모 = 몬스터.
     7px 마름모를 1.35배로 늘려 금색을 칠했더니 "노란 직사각형"으로 읽혔다 —
     작은 도형은 **키우지 말고 테두리를 둘러** 지금 자리를 표시한다. */
  /* 마름모는 회전 때문에 10px 점이 12px 상자를 쓴다. 여유를 안 주면
     overflow 가 마지막 점의 모서리를 1px 잘라 먹는다. */
  #track {
    display: flex; gap: 5px; align-items: center; padding: 0 2px;
    min-width: 0; overflow: hidden;
  }
  #track i {
    width: 10px; height: 10px; flex: none; display: block; border-radius: 50%;
    background: #1c1409cc; box-shadow: inset 0 0 0 2px #efe3c4;
  }
  #track i.pve { border-radius: 2px; transform: rotate(45deg) scale(.86); }
  /* 지나온 라운드는 채워 둔다. 남은 라운드와 대비가 없으면 어디까지 왔는지 모른다. */
  #track i.done { background: #efe3c4; box-shadow: inset 0 0 0 2px #efe3c4; }
  /* 지금 자리. 바깥 고리 두 겹이 9px 점을 15px 로 부풀려 옆 점을 덮었다 —
     한 겹만 두르고 빛으로 띄운다. */
  /* 바깥 빛무리(0 0 8px)를 걸면 10px 점 둘레가 통째로 금색으로 번져,
     마름모 바깥까지 칠해진 것처럼 보인다. 안쪽 테두리만으로 구분한다 —
     이웃이 속 빈 점이라 채워진 것만으로 이미 눈에 띈다. */
  #track i.now { background: var(--gold); box-shadow: inset 0 0 0 2px #ffe9a8; }

  #timer {
    display: flex; align-items: center; gap: 4px; flex: none;
    font-variant-numeric: tabular-nums; font-weight: 800; font-size: 13px; line-height: 16px;
    min-width: 32px; justify-content: flex-end; color: #fff2e0;
    text-shadow: 0 1px 2px #0009;
  }
  #timer::before {
    content: ''; width: 13px; height: 13px; flex: none;
    background: url('/assets/ui/clock.png') center / contain no-repeat;
    image-rendering: pixelated;
  }
  #timer.warn { color: #ff9a7a; animation: pulse .6s steps(2, end) infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  /* 체력·인구는 목재 판에 얹는다 */

  /* 인구는 상단 바 안으로. 우측 세로 자리는 플레이어 목록이 통째로 쓴다. */
  #pop {
    display: flex; align-items: center; gap: 3px; flex: none;
    font-weight: 800; font-variant-numeric: tabular-nums; font-size: 12px; line-height: 16px;
    color: #f3ecdd; text-shadow: 0 1px 2px #0009;
  }
  #pop::before { content: '⬡'; font-size: 11px; opacity: .75; }
  #pop.full { color: #ffa08c; }

  /* ── 좌측: 시너지 ──────────────────────────────────── */
  #traits {
    position: absolute; left: 6px; top: 40px; width: 158px;
    max-height: calc(100% - 80px);
    display: flex; flex-direction: column; gap: 2px; z-index: 4;
    overflow-y: auto; pointer-events: none;
  }
  .trait {
    pointer-events: auto; flex: none; line-height: 1;
    display: flex; align-items: center; gap: 5px; height: 27px; padding: 0 3px 0 0;
    border-style: solid; border-width: 6px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    background: #c58747;
    image-rendering: pixelated;
    font-size: 13px; color: #f0e6cf; text-shadow: 0 1px 2px #0009;
  }
  .trait .n { flex: 1; line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 12px 숫자는 12px 줄상자에 안 들어간다 (실측 15). */
  .trait .c {
    font-variant-numeric: tabular-nums; font-size: 12px; line-height: 15px; color: #cbbfa6;
  }
  .trait.off { opacity: .45; }
  /* 육각 배지 + 등급색. 안에는 시너지 아이콘.
     첫 글자를 쓰던 때는 "거인"과 "전사"가 글자로만 보면 구분이 안 됐다. */
  .trait .pip {
    width: 19px; height: 22px; flex: none;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: var(--ic) center / 13px no-repeat, #4a4458;
    image-rendering: pixelated;
  }
  .trait.s1 .pip { background: var(--ic) center / 13px no-repeat, linear-gradient(#d99154, #a5602c); }
  .trait.s2 .pip { background: var(--ic) center / 13px no-repeat, linear-gradient(#e6edf5, #a8b4c4); }
  .trait.s3 .pip { background: var(--ic) center / 13px no-repeat, linear-gradient(#ffe08a, #d9a12c); }
  .trait.s1 .c { color: #f0b078; }
  .trait.s2 .c { color: #eef4ff; }
  .trait.s3 .c { color: var(--gold); }

  /* ── 우측: 플레이어 ────────────────────────────────── */
  /* 8명이 **전부** 보여야 한다. 스크롤에 밀리면 체력이 깎여 아래로 내려간
     내 줄이 화면 밖으로 나간다. */
  /* 8칸이 무대 높이를 나눠 갖는다. 칸 높이를 박아 두면 하단 UI 를 키울 때마다
     아래쪽 등수가 잘려 나간다 (26×8+틈 = 215 > 무대 176). */
  /* 순위표. **판 하나에 여덟 줄**이다.
     줄마다 9-슬라이스 액자를 두르면 테두리만 여덟 겹이라 우측이 통째로
     계기판이 되고, 강철판(푸른 회색)은 나무로 짠 나머지 UI 와 색조가 어긋난다.
     상단 띠·상점 판과 같은 나무를 쓰고 줄은 선으로만 가른다. */
  /* 순위표. 줄마다 **따로 선 팻말**이고, 폭은 이름 길이를 따라간다.
     고정 폭으로 잡으면 짧은 이름 줄에 빈 나무가 남고, 그 빈 자리가 판을 가린다.
     오른쪽 끝에 맞춰 세우므로 왼쪽 들쭉날쭉이 곧 이름 길이가 된다. */
  #lobby {
    position: absolute; right: 6px; top: 8px; bottom: 42px; z-index: 4;
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
  }
  .seat {
    flex: 0 1 auto; min-height: 0; height: 26px; max-width: 148px;
    display: flex; align-items: center; gap: 4px; padding: 0 0 0 3px;
    border-style: solid; border-width: 6px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    background: #c58747;
    image-rendering: pixelated;
    font-size: 10px; color: #f0e6cf; cursor: pointer;
    text-shadow: 0 1px 2px #0009;
  }

  /* 원형 체력 게이지.
     막대를 따로 두면 8줄 × 막대로 자리를 두 배 먹는다. 초상화 테두리 자체를
     게이지로 쓰면 자리를 하나도 더 안 먹는다 — conic-gradient 가 --hp(0~1)
     만큼 칠하고 나머지는 어둡게 남는다.
     팻말 오른쪽 모서리에 걸치게 둔다. 액자 안(14px)에 넣으면 글자가 안 보인다. */
  .seat .av {
    position: relative; width: 22px; height: 22px; flex: none; border-radius: 50%;
    margin: -4px -3px -4px 0;
    background: conic-gradient(var(--hc, #5fd68a) calc(var(--hp, 1) * 360deg), #1c130ad9 0);
    box-shadow: 0 0 0 1px #00000080;
  }
  .seat .av b {
    position: absolute; inset: 2px; border-radius: 50%;
    display: grid; place-items: center;
    background: #4a3a25; color: #f0e6cf; font-size: 10px; font-weight: 800;
    box-shadow: inset 0 0 0 1px #00000073;
  }
  .seat.me .av b { background: linear-gradient(#ffe08a, #d9a12c); color: #3a2a06; }
  .seat.foe .av b { background: linear-gradient(#ff9a8c, #d9503c); color: #3a1109; }

  .seat .n {
    min-width: 0; line-height: 13px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .seat .h {
    flex: none; font-variant-numeric: tabular-nums; font-weight: 800;
    font-size: 11px; line-height: 14px; color: var(--hc, #5fd68a);
  }

  /* 내 줄에는 이름을 안 적는다 — 내가 누군지는 내가 안다. 초상화와 체력만. */
  .seat.me .n { display: none; }
  .seat.foe .n::after { content: ' ⚔'; color: #ff9a8c; }

  /* 3연승 이상. 초상화를 금빛 고리로 두르고 옅게 떨게 한다 —
     누가 달리고 있는지가 순위(체력)만으로는 안 보인다. 체력이 아직 높은
     사람과 지금 몰아치는 사람은 다른 정보다. */
  .seat.hot .av { box-shadow: 0 0 0 1px #ffd166, 0 0 6px #ffb04dcc; }
  .seat.hot .av b { box-shadow: inset 0 0 0 1px #ffd166a6; }
  .seat.hot .n::before {
    content: '▲'; margin-right: 2px; font-size: 8px; color: #ffd166;
  }
  .seat.hot.me .n::before { color: #7a5306; }

  /* 탈락. 흐리게만 두면 "체력 낮은 사람"과 구분이 안 된다 — 초상화에 ✕ 를 찍는다. */
  .seat.out { filter: grayscale(1) brightness(.72); opacity: .5; cursor: default; }
  .seat.out .av b::after {
    content: '✕'; position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 800; color: #efe3c4;
  }
  .seat.open {
    border-image-slice: 6; background: #e0a94c;
    border-image-source: url('/assets/ui/button_light.png'); color: #4a3a1c;
  }
  .seat.open .n { color: #4a3a1c; }

  /* ── 상세 패널 ─────────────────────────────────────── */
  .panel {
    position: absolute; z-index: 8;
    border-style: solid; border-width: 10px; border-image-slice: 6;
    border-image-repeat: repeat; image-rendering: pixelated;
    border-image-source: url('/assets/ui/panel_wood.png');
    background: #c58747;
    filter: drop-shadow(0 5px 14px #000a);
    font-size: 10px; color: #f0e9dc;
  }
  .panel[hidden] { display: none; }

  /* 무대가 226px 뿐이다. top 80 에서 시작하면 능력치 표 아래가 잘린다. */
  #info {
    right: 166px; top: 56px; width: 176px; --pc: var(--tc, #6f7fd8);
    max-height: calc(100% - 66px); overflow-y: auto;
  }
  #info .hd {
    display: flex; align-items: center; gap: 7px; padding: 2px 0 6px;
    border-bottom: 1px solid #00000040;
  }
  #info .hd img { width: 30px; height: 30px; object-fit: contain; flex: none; }
  #info .hd .t { flex: 1; min-width: 0; }
  #info .hd .nm { font-weight: 800; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #info .hd .sub { font-size: 9px; color: #b3a894; }
  #info .hd .st { color: var(--sc); font-size: 11px; letter-spacing: -1px; }
  #info .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px;
    padding: 6px 0; border-top: 1px solid #ffffff1a; font-variant-numeric: tabular-nums;
  }
  #info .grid span { color: #b3a894; }
  #info .grid b { float: right; font-weight: 700; color: #fff6e4; }
  /* 스킬 설명은 문장이라 가장 길다 — 여기가 제일 커 보였다. */
  #info .sk {
    padding: 5px 0; border-top: 1px solid #ffffff1a;
    font-size: 9px; line-height: 1.35; color: #e6dcc8;
  }
  #info .sk em { color: #8fd8ff; font-style: normal; font-weight: 700; }
  #info .items { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  #info .items span {
    display: flex; align-items: center; gap: 3px;
    font-size: 11px; color: var(--dim);
    background: #ffffff14; border-radius: 3px; padding: 1px 4px;
  }
  #info .items img { width: 14px; height: 14px; image-rendering: pixelated; }
  #info .sell { padding: 4px 0 0; border-top: 1px solid #ffffff1a; color: #b3a894; font-size: 9px; }
  #info .sell b { color: var(--gold); }
  #info .sell b::before,
  #streak .bn::before {
    content: ''; display: inline-block; vertical-align: -1px;
    width: 10px; height: 10px; margin-right: 2px;
    background: url('/assets/ui/coin.png') center / contain no-repeat;
    image-rendering: pixelated;
  }

  /* 무대보다 길어지면 아래쪽 유닛 목록이 통째로 잘린다 — 그걸 보라고 만든 패널이다. */
  /* 시너지 상세. 판 위에 뜨는 참고 패널이라 크면 판을 통째로 가린다.
     **스크롤을 걸지 않는다** — 참고 패널을 굴려 가며 읽게 만들면 그 사이
     마우스가 패널을 벗어나 닫힌다. 대신 가장 큰 경우(7명 · 3단계)가
     그대로 들어가는 크기로 잡는다. */
  #traitinfo {
    left: 146px; top: 46px; width: 162px;
    font-size: 10px; line-height: 13px;
  }
  #traitinfo .hd {
    display: flex; align-items: center; gap: 4px; padding: 0 0 3px;
    border-bottom: 1px solid #00000040; font-weight: 800; font-size: 11px;
  }
  #traitinfo .hd::before {
    content: ''; flex: none; width: 13px; height: 13px;
    background: var(--ic) center / contain no-repeat;
    image-rendering: pixelated;
  }
  #traitinfo .hd .c { margin-left: auto; color: var(--gold); font-variant-numeric: tabular-nums; }
  #traitinfo .steps { padding: 3px 0; display: flex; flex-direction: column; gap: 1px; }
  #traitinfo .step { display: flex; gap: 5px; line-height: 1.15; opacity: .45; }
  #traitinfo .step.on { opacity: 1; }
  #traitinfo .step b { flex: none; width: 12px; text-align: right; color: #cbbfa6; }
  #traitinfo .step.on b { color: var(--gold); }
  /* 유닛 목록. 필요한 건 **몇 티어이고 어떻게 생겼나** 둘뿐이다 —
     이름표를 빼고 테두리 색으로 티어를 말한다 (상점 카드 이름띠와 같은 색). */
  #traitinfo .mem { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px 0 0; border-top: 1px solid #ffffff1a; }
  #traitinfo .mem figure {
    position: relative; width: 26px; height: 26px; border-radius: 4px;
    background: color-mix(in srgb, var(--tc) 24%, #1a1420);
    box-shadow: inset 0 0 0 1px var(--tc);
  }
  #traitinfo .mem img { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* 티어 숫자. 색만으로는 4티어(보라)와 5티어(금)를 헷갈린다. */
  #traitinfo .mem figcaption {
    position: absolute; right: -1px; bottom: -1px;
    min-width: 10px; height: 10px; padding: 0 1px; border-radius: 3px;
    background: var(--tc); color: #14101c;
    font-size: 8px; line-height: 10px; font-weight: 800; text-align: center;
  }
  #traitinfo .mem figure.no { filter: grayscale(1) brightness(.5); }
  /* 짚은 유닛 이름. 아무것도 안 짚었을 때도 자리를 남긴다 — 줄이 생겼다
     사라지면 패널 높이가 튀어 마우스가 패널 밖으로 떨어진다. */
  #traitinfo .pick {
    display: flex; align-items: center; gap: 4px;
    /* min-height 로 두면 글자가 들어올 때 4px 늘어난다. 패널 높이가 튀면
       아래쪽에 있던 마우스가 패널 밖으로 떨어져 패널이 닫힌다. 못 박는다. */
    height: 14px; margin-top: 3px; padding-top: 3px;
    border-top: 1px solid #ffffff1a;
    font-size: 10px; line-height: 14px; font-weight: 700; color: #f0e6cf;
  }
  #traitinfo .pick .t {
    flex: none; min-width: 12px; height: 11px; border-radius: 3px;
    background: var(--tc, #6a6252); color: #14101c;
    font-size: 8px; line-height: 11px; font-weight: 800; text-align: center;
  }

  #hint {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 9;
    padding: 5px 14px; border-radius: 20px;
    background: rgba(0,0,0,.78); color: var(--ink); font-size: 12px;
    pointer-events: none; opacity: 0; transition: opacity .18s;
  }
  #hint.show { opacity: 1; }

  /* ── 아이템 바 ─────────────────────────────────────
     무대(#stage)와 상점 판(#shopbar) 사이, 제 줄을 갖는다.
     처음엔 무대 안에 절대좌표(bottom:6)로 띄웠는데, 그 자리는 이미
     #hudbar(레벨·XP 줄)가 z-index 까지 같이 차지하고 있어 DOM 순서에서
     밀려 나무판 밑에 완전히 깔렸다 — 화면엔 안 보이는데 드래그만 되는
     유령 줄이었다. 무대 안엔 좌우로 시너지 목록(#traits)·순위표(#lobby)까지
     바닥 코앞까지 내려와 있어 절대좌표로는 안 겹치는 틈이 없었다.
     그래서 무대 바깥, flex 줄로 뺀다 — #stage 가 flex:1 이라 이 줄이
     생기는 만큼 스스로 줄어들고(ResizeObserver 가 그 변화를 보고 판을
     다시 잰다), 아무것도 가리지 않는다. 비면 줄 자체가 사라진다 —
     빈 칸을 남겨 두면 "받을 게 있는데 안 받았나"로 읽힌다. */
  #itembar {
    flex: none; display: flex; align-items: center; gap: 3px;
    padding: 4px 6px;
  }
  #itembar:empty { display: none; padding: 0; }
  #itembar .it {
    position: relative; width: 26px; height: 26px;
    background: #12101ce8; border: 1px solid #ffffff2e; border-radius: 4px;
    cursor: grab; touch-action: none;
  }
  #itembar .it img { width: 100%; height: 100%; image-rendering: pixelated; }
  /* 같은 아이템이 여럿이면 개수만 적는다. 칸을 여러 개 두면 줄이 넘친다. */
  #itembar .it b {
    position: absolute; right: -2px; bottom: -3px;
    font-size: 10px; line-height: 1; padding: 1px 3px;
    background: #0d0b12; border-radius: 3px; color: var(--gold);
  }

  /* ── 정보 줄 (판 위에 뜬다) ────────────────────────── */
  /* 레벨 · 확률 · 골드 · 연승 · 잠금은 **상점 판 안에 넣지 않는다.**
     같은 갈색 판에 묶으면 "상점의 일부"로 읽히는데, 이건 내 상태지
     상점 물건이 아니다. 판 위에 각자 자기 틀을 쓰고 뜬다. */
  /* 좌 · 중 · 우 세 칸. flex 로 늘어놓으면 왼쪽 것들 폭에 따라 골드가 흔들린다 —
     골드는 화면 정가운데에 고정돼야 눈이 매번 같은 자리를 본다. */
  /* 무대 안에 띄우면 3D 대기석을 덮는다. 무대와 상점 판 **사이**의 제 줄이다.
     상점 판(갈색) 안에는 넣지 않는다 — 이건 내 상태지 상점 물건이 아니다. */
  /* 무대 **위에 뜬다.** 무대 밖에 띠로 두면 그 48px 이 통째로 남색 벽이 되어
     바로 뒤에 있는 대기석을 가린다. 값 넷을 앉히자고 판을 잘라 먹는 셈이다.
     바탕은 투명, 글자만 뜬다 — 아래쪽에 옅은 그늘만 깔아 3D 위에서도 읽히게. */
  #hudbar {
    position: absolute; left: 6px; right: 6px; bottom: 0; height: 36px; z-index: 6;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    pointer-events: none;
  }
  /* 누를 수 있는 것만 포인터를 받는다 — 나머지는 뒤의 판을 그대로 집게 둔다. */
  #lock { pointer-events: auto; }
  #hudL { display: flex; align-items: center; gap: 6px; justify-self: start; }
  /* 골드가 절대 배치(가운데)라 흐름으로는 오른쪽 칸이 안 밀린다.
     잠금도 같이 못 박아 화면 오른쪽 끝에 붙인다. */
  #hudR {
    position: absolute; right: 0; display: flex; align-items: center; gap: 6px;
  }
  /* 확률 · 골드 · 연승은 **한 덩어리**로 가운데. 같은 질문("지금 뭘 살 수 있나")에
     답하는 값들이라 눈이 한 번만 가야 한다. */
  /* 골드는 흐름에서 빼서 화면 정가운데에 못 박는다. 격자의 auto 칸에 두면
     좌측 묶음(레벨+확률)이 자기 몫보다 넓어지는 순간 골드가 그만큼 밀린다 —
     700px 폭에서 실제로 9px 밀렸다. */
  #hudC {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center;
  }
  #hudC #streak { position: absolute; left: 100%; margin-left: 8px; }

  /* 레벨 · 확률 · 골드는 각자 자기 틀 안에 든다. 3D 판 위에 글자만 떠 있으면
     밝은 타일에서 값이 묻힌다. 틀은 상점 판과 같은 나무 — 하단이 한 벌로 읽힌다.
     9-슬라이스 6px 이 사방을 먹으므로 높이는 그만큼 더 잡는다. */
  #lvbox, #odds, #gold {
    /* 700px 폭에서는 가운데 칸(골드)이 양옆을 눌러 'Lv 7' 과 'XP 0/30' 이
       두 줄로 접혔다. 접히지 않게 못 박는다 — 접히면 30px 틀을 뚫는다. */
    height: 30px; align-items: center; white-space: nowrap;
    border-style: solid; border-width: 6px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    background: #c58747;
    image-rendering: pixelated;
  }

  /* 레벨 · 확률 · 골드 · 연패는 **틀 없이** 둔다.
     각자 9-슬라이스 판을 두르면 한 줄에 상자가 넷 늘어서서, 값이 아니라
     상자들이 먼저 읽힌다. 값 자체가 크고 색이 다르므로 틀이 없어도 갈린다.
     테두리가 필요한 건 **누를 수 있는 것**(잠금 버튼)뿐이다. */
  #lvbox { display: flex; gap: 6px; padding: 0 3px; }
  #lvl {
    font-size: 15px; font-weight: 800; color: #fff2d8; line-height: 18px; white-space: nowrap;
    text-shadow: 0 1px 2px #0009;
  }
  #lvl::before { content: 'Lv '; font-size: 9px; font-weight: 700; color: #cbbfa6; }
  /* 한 줄로 눕힌다. 22px 안쪽에 두 줄을 넣으면 9px 글자가 되어 안 읽힌다. */
  #xprow { display: flex; align-items: center; }
  /* 막대는 뺐다. 0% 일 때 가운데를 가로지르는 선으로만 읽힌다. */
  #xpbar { display: none; }
  #xptext {
    font-size: 12px; line-height: 18px; color: #8fd8ff; font-weight: 800;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #0009;
  }
  #xptext::before { content: 'XP '; font-size: 9px; color: #cbbfa6; font-weight: 700; }

  /* 티어 확률. 참고용 숫자다 — 크게 잡으면 상점 카드보다 눈에 먼저 든다. */
  /* 색은 보석이 나르고 숫자는 배경 없이 읽힌다.
     보석 그림을 **마스크로** 쓴다 — 팩에 보라(4티어)가 없어서 색깔별 타일을
     골라 쓸 수가 없다. 모양은 에셋에서, 색은 티어에서 온다. */
  #odds { display: flex; gap: 3px; padding: 0 2px; }
  #odds span {
    display: flex; align-items: center; gap: 2px;
    font-size: 10px; line-height: 10px; font-weight: 800;
    font-variant-numeric: tabular-nums; color: #f0e6cf; text-shadow: 0 1px 2px #0009;
  }
  #odds span i {
    width: 10px; height: 10px; flex: none; background: var(--oc);
    -webkit-mask: url('/assets/ui/gem.png') center / contain no-repeat;
    mask: url('/assets/ui/gem.png') center / contain no-repeat;
  }
  /* 자릿수가 달라 폭이 흔들리면 다섯 칸이 줄을 안 선다. 폭을 못 박고 가운데. */
  #odds span b {
    width: 21px; text-align: center; font-weight: 800;
  }
  #odds span.zero { color: #8d8371; }
  #odds span.zero i { background: #6b6353; opacity: .5; }

  #gold {
    display: flex; gap: 5px; padding: 0 8px 0 5px; line-height: 20px;
    font-size: 17px; font-weight: 800; color: #ffe08a; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px #0009;
  }
  #gold::before {
    content: ''; width: 15px; height: 15px; flex: none;
    background: url('/assets/ui/coin.png') center / contain no-repeat;
    image-rendering: pixelated;
  }

  /* 연승·연패. 다음 라운드 수입이 이걸로 갈리는데 화면에 없었다. */
  /* 연승·연패. 다음 라운드 수입이 여기서 갈린다.
     min-width 를 주는 이유: 연승이 붙는 순간 골드가 옆으로 밀리면
     눈이 매번 골드를 다시 찾아야 한다. */
  #streak {
    display: flex; align-items: center; gap: 3px; min-width: 52px;
    font-size: 12px; line-height: 16px; font-weight: 700; white-space: nowrap;
    text-shadow: 0 1px 2px #000, 0 0 4px #0009;
  }
  #streak::before { font-size: 10px; }
  #streak.none::before { content: ''; }
  #streak.win { color: #8ff0bb; }
  #streak.win::before { content: '\25B2'; }
  #streak.lose { color: #ffa8b3; }
  #streak.lose::before { content: '\25BC'; }
  #streak b { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 800; }
  #streak .bn { color: var(--gold); }

  #lock {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 30px;
    border-style: solid; border-width: 6px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/button.png');
    background: #c58747;
    image-rendering: pixelated;
    font-size: 11px; font-weight: 700; color: #f3ecdd; text-shadow: 0 1px 2px #0009;
  }
  #lock::before {
    content: ''; width: 16px; height: 16px; flex: none;
    background: url('/assets/ui/lock_open.png') center / contain no-repeat;
    image-rendering: pixelated;
  }
  #lock.on { border-image-source: url('/assets/ui/button_light.png'); background: #e0a94c; }
  #lock.on::before { background-image: url('/assets/ui/lock_closed.png'); }

  /* ── 상점 판 ───────────────────────────────────────── */
  /* 이 판에는 **살 것만** 들어간다. 카드와 그걸 굴리는 버튼 둘. */
  #shopbar {
    flex: none; height: var(--shopH);
    display: flex; align-items: stretch; gap: 6px;
    border-style: solid; border-width: 12px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    background: #c58747;
    image-rendering: pixelated;
    transition: filter .12s;
  }
  #shopbar.selling { filter: hue-rotate(-25deg) saturate(1.8) brightness(1.15); }

  #sidebtns { width: 138px; flex: none; display: flex; flex-direction: column; gap: 6px; }
  .btn {
    flex: 1; line-height: 1;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    /* fill 을 안 쓴다. button.png 은 테두리 6px 이 밝은 갈색(197,135,71)이고
       가운데가 어두운 갈색(163,112,58)이다 — 원본의 입체감인데, 넓은 버튼에
       늘리면 그 면이 "반투명 검정 네모"로 읽힌다. 안쪽은 테두리 색으로 채운다. */
    border-style: solid; border-width: 6px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/button.png');
    background: #c58747;
    image-rendering: pixelated;
    font-size: 13px; font-weight: 700; color: #f3ecdd; text-shadow: 0 1px 2px #0009;
  }
  .btn .cost {
    /* 13px 글자에 13px 줄상자면 2px 모자란다 (실측 15). 명시한다. */
    flex: none; line-height: 16px;
    display: flex; align-items: center; gap: 3px;
    color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .btn .cost::before {
    content: ''; width: 12px; height: 12px; flex: none;
    background: url('/assets/ui/coin.png') center / contain no-repeat;
    image-rendering: pixelated;
  }
  /* 단축키 표시. 버튼을 누르러 가는 손이 키를 배우게 하는 가장 싼 방법이다 —
     따로 도움말을 두면 아무도 안 연다. */
  .btn .kb {
    /* 흐름 안에 둔다. 절대 배치로 얹으면 가운데 정렬된 글자 위에 겹친다. */
    flex: none; min-width: 13px; height: 13px; padding: 0 2px; border-radius: 3px;
    background: #efe3c4; color: #4a3a1c;
    font-size: 9px; line-height: 13px; font-weight: 800; text-align: center;
  }
  .btn:disabled .kb { opacity: .45; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { filter: grayscale(.7) brightness(.62); cursor: default; }

  /* 정사각. 가로로 길면 초상화가 납작해져 무슨 몬스터인지 안 읽힌다.
     남는 폭은 가운데 정렬로 흘린다 — 늘려서 채우면 다시 직사각이 된다. */
  #shop { flex: 1; display: flex; gap: 5px; min-width: 0; }

  /* 카드. 나무 액자를 두르지 않는다 — 6px 9-슬라이스가 사방을 먹어
     78px 카드에서 실제 그림 자리가 66px 밖에 안 남았다. 대신 **아트가 카드
     전체를 채우고**, 정보는 그 위에 얹는다:
       좌상단  특성 두 줄 (어두운 스크림 위)
       하단 띠  이름 왼쪽 · 값 오른쪽, 띠 색이 곧 티어
     참고한 오토체스 상점이 쓰는 배치다. 액자 대신 티어색이 테두리 노릇을 한다. */
  .card {
    --tc: var(--t1);
    flex: 1; min-width: 0; position: relative; overflow: hidden;
    border-radius: 3px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 26%, #15121d), #0c0a12);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 45%, transparent), 0 2px 5px #000a;
  }
  /* 위쪽 후광. 어두운 모델이 어두운 판에 묻히는 걸 막는다. */
  .card::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 72% at 50% 4%, color-mix(in srgb, var(--tc) 46%, transparent), transparent 76%);
  }
  .card.empty { --tc: #6a6252; opacity: .28; }
  .card.empty::before { display: none; }
  .card:not(.empty):active { transform: translateY(1px); }

  /* 이미 갖고 있는 말인지, 사면 승급하는지.
     이게 없으면 두 장 모아 둔 말과 처음 보는 말이 카드에서 똑같이 생겼다. */
  .card .own {
    position: absolute; right: 2px; top: 2px; z-index: 3;
    height: 14px; padding: 0 4px; border-radius: 7px;
    display: flex; align-items: center;
    background: #e8dcc0; color: #2a1d08;
    box-shadow: 0 1px 3px #000a;
    font-size: 9px; line-height: 14px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  /* 승급은 별 색으로 — 은(2성) · 금(3성). 셋을 모으는 게 이 게임의 목표라
     카드 테두리까지 같이 밝힌다. */
  .card .own.up {
    height: 15px; padding: 0 5px; letter-spacing: -1px;
    background: var(--sc); color: #2a1d08;
    box-shadow: 0 0 6px var(--sc), 0 1px 3px #000a;
  }
  .card.up { box-shadow: inset 0 0 0 2px var(--sc), 0 0 10px color-mix(in srgb, var(--sc) 55%, transparent); }
  .card.poor { filter: grayscale(.55) brightness(.7); }

  .card .art { position: absolute; left: 0; right: 0; top: 0; bottom: 22px; z-index: 1; }
  .card .art img {
    width: 100%; height: 100%; object-fit: contain;
    /* 그림 자리는 128×50 인데 섬네일은 정사각이다 — contain 이면 세로에 맞춰
       50px 폭만 쓰고 좌우 78px 이 통째로 빈다. 키워서 넘치게 두고 카드가
       잘라 낸다 (참고한 상점도 아트를 잘라 쓴다). 발밑은 이름띠가 덮는다. */
    transform: scale(1.62) translateY(6%);
    filter: drop-shadow(0 3px 5px #000b);
  }

  /* 특성은 좌상단에 세로로. 검은 스크림을 깔면 카드 왼쪽이 통째로 어두워져
     초상화 절반이 그늘에 들어간다 — 대신 아이콘을 앞에 세우고 글자에 그림자를
     세게 준다. 아이콘이 있으니 글자가 조금 묻혀도 무엇인지 읽힌다. */
  .card .tr {
    position: absolute; left: 0; top: 0; z-index: 2;
    display: flex; flex-direction: column; gap: 1px;
    padding: 2px 6px 3px 2px;
    font-size: 9px; line-height: 12px; font-weight: 700; color: #f0e6cf;
    letter-spacing: -.2px;
    text-shadow: 0 1px 2px #000, 0 0 4px #000, 0 0 6px #000;
  }
  .card .tr i {
    display: flex; align-items: center; gap: 3px; font-style: normal;
    white-space: nowrap;
  }
  .card .tr i::before {
    content: ''; flex: none; width: 11px; height: 11px;
    background: var(--ic) center / contain no-repeat;
    image-rendering: pixelated;
    filter: drop-shadow(0 1px 1px #000);
  }

  /* 하단 띠 = 이름 + 값. 티어색이 여기에만 진하게 들어간다. */
  .card .nm {
    position: absolute; left: 0; right: 0; bottom: 0; height: 22px; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    padding: 0 5px;
    /* 진짜 반투명. 불투명한 색끼리 섞으면(#0c0a12cc 처럼 알파가 있어도)
       결과 알파가 0.9 를 넘어 아무것도 안 비친다 — transparent 와 섞는다.
       불투명하면 초상화 발밑이 통째로 잘려 나간다. */
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--tc) 40%, transparent),
      color-mix(in srgb, var(--tc) 22%, transparent));
    box-shadow: inset 0 1px 0 #ffffff2e;
    font-size: 11px; line-height: 22px; font-weight: 800; color: #fff;
    letter-spacing: -.3px; text-shadow: 0 1px 2px #000, 0 0 4px #000c;
  }
  .card .nm b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .pr {
    flex: none; display: flex; align-items: center; gap: 2px;
    color: #ffe6a8; font-variant-numeric: tabular-nums;
  }
  .card .pr::before {
    content: ''; width: 11px; height: 11px; flex: none;
    background: url('/assets/ui/coin.png') center / contain no-repeat;
    image-rendering: pixelated;
  }

  /* ── 전투 조작 ─────────────────────────────────────── */
  .teamA { color: var(--team-a); }
  .teamB { color: var(--team-b); }

  /* ── 드래그 유령 ───────────────────────────────────── */
  #ghost {
    position: fixed; width: 56px; height: 56px; pointer-events: none;
    z-index: 50; display: none; transform: translate(-50%, -62%);
  }
  #ghost img { width: 100%; height: 100%; object-fit: contain; }
  #ghost.sell { filter: drop-shadow(0 0 7px var(--sell)); }

  #rotate {
    display: none; position: fixed; inset: 0; z-index: 90;
    background: var(--bg); color: var(--dim);
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  @media (orientation: portrait) { #rotate { display: flex; } }

  /* 부팅 — 리소스를 **전부** 받고 나서 게임을 연다. 중간에 받으면 상점 카드가
     빈 채로 뜨고 말이 한 박자 늦게 나타난다. */
  #boot {
    position: fixed; inset: 0; z-index: 80;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: var(--bg); color: var(--dim);
  }
  #boot .bar {
    width: 220px; height: 10px; border-radius: 5px; overflow: hidden;
    background: #00000070; box-shadow: inset 0 0 0 1px #ffffff20;
  }
  #boot .bar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #3aa0d8, #7ee0c0);
    transition: width .12s linear;
  }
  #boot .pct { font-variant-numeric: tabular-nums; font-size: 12px; }
</style>
</head>
<body>
  <div id="viewport">
  <div id="prep" class="screen" hidden>
    <div id="stage">
      <div id="top">
        <div id="topwrap">
          <div id="topbar" class="n9">
            <span id="roundtag">1-1</span>
            <span id="track"></span>
            <span id="timer">30</span>
            <span id="pop">0/3</span>
          </div>
          <div id="timebar"><i></i></div>
        </div>
      </div>

      <div id="traits"></div>
      <div id="lobby"></div>

      <div id="info" class="panel" hidden></div>
      <div id="traitinfo" class="panel" hidden></div>
      <div id="hint"></div>

      <div id="hudbar">
        <div id="hudL">
          <div id="lvbox">
            <span id="lvl">3</span>
            <span id="xprow"><span id="xpbar"><i></i></span><span id="xptext">0/2</span></span>
          </div>
          <div id="odds"></div>
        </div>
        <div id="hudC">
          <div id="gold"><span id="goldval">0</span></div>
          <div id="streak" class="none"></div>
        </div>
        <div id="hudR">
          <button id="lock" type="button" aria-label="상점 잠금"></button>
        </div>
      </div>
    </div>

    <div id="itembar"></div>

    <div id="shopbar">
      <div id="sidebtns">
        <button class="btn" id="buyxp"><span class="kb">F</span>경험치 구매<span class="cost">4</span></button>
        <button class="btn" id="reroll"><span class="kb">D</span>새로고침<span class="cost">2</span></button>
      </div>
      <div id="shop"></div>
    </div>
  </div>

  </div>

  <div id="ghost"><img alt="" /></div>
  <div id="rotate">가로로 돌려주세요</div>
  <div id="boot">
    <div class="msg">불러오는 중…</div>
    <div class="bar"><i></i></div>
    <div class="pct">0%</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
