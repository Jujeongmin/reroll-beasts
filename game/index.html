<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Reroll Beasts</title>
<!-- 홈 배경은 부팅 화면 뒤에서 미리 받아 둔다. CSS 가 홈을 그릴 때 처음
     받으면 첫 진입에서 배경 없는 홈이 한 번 번쩍인다.
     preload 가 아니라 prefetch 인 이유: 부팅(모델 26종)이 몇 초 걸려서
     preload 는 "받아 놓고 안 썼다"고 경고한다 — 실제로는 그때 쓴다. -->
<link rel="prefetch" as="image" href="/assets/home/bg_scene.webp" />
<style>
  /* ─────────────────────────────────────────────────────────
     TFT 배치를 따른다. 판이 화면의 주인이고 HUD 는 그 위에 뜬다.

     이 UI 의 뼈대는 **비스듬한 판(평행사변형)** 이다. TFT 의 시너지 줄과
     플레이어 줄이 전부 그 모양이고, 직사각형 목록과는 인상이 완전히 다르다.
     clip-path 로 자른다 — border-radius 로는 못 만드는 각이다.

     세로가 390px 뿐이라 상단·좌우를 띠로 쌓지 않고 판 위에 겹친다.
     ───────────────────────────────────────────────────────── */
  :root {
    --bg: #0e1220;
    --ink: #f3ecdd;
    --dim: #a9a08f;
    --gold: #ffd166;
    --hp: #ff6b7a;
    --xp: #6fd8ff;
    --team-a: #5ff0e0;
    --team-b: #ff7a6f;
    --sell: #e8654f;
    --t1: #9aa3b2; --t2: #4fb96a; --t3: #4f8fe8; --t4: #b06fe8; --t5: #e8b34f;
    --plate: #12101ce8;
    --edge: #ffffff1c;

    --shopH: 100px;
    /* 비스듬한 판의 기울기. 한 곳에서 정해야 좌우가 대칭으로 보인다. */
    --skew: 9px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  ::-webkit-scrollbar { display: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  img { image-rendering: pixelated; }

  /* ── 반응형 ────────────────────────────────────────
     기준 화면은 812×390 (가로 든 휴대폰) 이다. 여기 맞춰 잰 값이 수십 개라
     화면 크기마다 다시 재기보다, **판 하나를 통째로 확대·축소**한다.
     세로는 390 으로 고정하고 가로만 실제 화면비를 따라가므로 (범위 안에서)
     레터박스 없이 꽉 찬다. 크기는 JS 가 매 resize 마다 넣는다. */
  #viewport {
    position: fixed; left: 50%; top: 50%;
    transform-origin: 50% 50%;
  }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .screen[hidden] { display: none; }
  /* ── 무대 ──────────────────────────────────────────── */
  #stage {
    flex: 1; min-height: 0; position: relative; overflow: hidden;
    background: radial-gradient(130% 100% at 50% 6%, #3a4d7d 0%, #1b2440 50%, #0d1120 100%);
  }
  #stage canvas { display: block; position: relative; }

  /* 9-슬라이스 도우미. 원본 32px, 테두리 6px.
     테두리가 좌우 2×BW · 상하 2×BW 를 먹으므로 크기를 잡을 때 그만큼 더한다. */
  /* 금화. 값이 골드라는 걸 아이콘 하나로 말한다 — 쓰는 곳마다 다시 그리지 않게
     여기 한 번만 적는다. */
  .coin {
    background: url('/assets/ui/coin.png') center / contain no-repeat;
    image-rendering: pixelated;
  }

  .n9 {
    border-style: solid; border-width: var(--bw, 10px);
    border-image-slice: 6; border-image-repeat: repeat;
    image-rendering: pixelated;
  }
  /* 3-슬라이스 가로 띠 (좌·중·우 이미지가 따로다) */
  .h3 {
    border-style: solid; border-width: 0 var(--bw, 9px);
    border-image-slice: 0 9 0 9 fill;
    image-rendering: pixelated;
  }

  /* ── 상단: 라운드 · 라운드 종류 트랙 · 남은 시간 ───── */
  /* 판 위에 뜨는 띠다. 여기 있는 건 전부 **참고값**(몇 라운드째 · 남은 시간 ·
     몇 마리 놓았나)이라, 크면 정작 판을 가린다. 화면 폭이 700~1040 사이에서
     변하므로 가운데 정렬로만 잡는다 — 좌우 어디에도 붙이지 않는다. */
  #top {
    position: absolute; top: 4px; left: 0; right: 0; z-index: 5;
    display: flex; align-items: flex-start; justify-content: center;
    pointer-events: none;
  }
  #topwrap {
    max-width: calc(100% - 24px); min-width: 0;
    display: flex; flex-direction: column; align-items: stretch;
  }
  /* 남은 시간 막대. 숫자만 있으면 "많이 남았나"를 매번 읽어서 계산해야 한다.
     띠 바로 밑에 깔아 상단 묶음이 한 덩어리로 읽히게 한다. */
  #timebar {
    height: 5px; margin: -3px 7px 0; border-radius: 3px; overflow: hidden;
    display: flex; justify-content: flex-end;
    background: #0b0f1eb0; box-shadow: inset 0 0 0 1px #ffffff26;
  }
  /* 가득 찬 상태에서 시작해 **빈 칸이 좌 → 우로** 밀고 들어온다.
     그래서 칠한 쪽을 오른쪽에 붙인다 (justify-content: flex-end).
     색은 남은 비율로 JS 가 섞는다. */
  #timebar i { display: block; height: 100%; width: 100%; }
  #timebar.warn i { animation: pulse .6s steps(2, end) infinite; }

  #topbar {
    min-width: 0;
    display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 3px;
    border-style: solid; border-width: 6px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    background: #c58747;
    image-rendering: pixelated;
  }
  /* 액자 안에 액자를 또 두르면 28px 짜리 띠가 통째로 테두리가 된다.
     라운드 번호는 색과 굵기로만 구분한다. */
  #roundtag {
    display: flex; align-items: center; flex: none;
    font-size: 14px; line-height: 16px; font-weight: 800; letter-spacing: .5px;
    color: var(--gold); text-shadow: 0 1px 2px #000, 0 0 4px #0009;
  }

  /* 라운드 종류 트랙. 마름모 = PvE, 원 = 상대. */
  /* 이번 스테이지의 라운드 점열. 원 = 대결, 마름모 = 몬스터.
     7px 마름모를 1.35배로 늘려 금색을 칠했더니 "노란 직사각형"으로 읽혔다 —
     작은 도형은 **키우지 말고 테두리를 둘러** 지금 자리를 표시한다. */
  /* 마름모는 회전 때문에 10px 점이 12px 상자를 쓴다. 여유를 안 주면
     overflow 가 마지막 점의 모서리를 1px 잘라 먹는다. */
  #track {
    display: flex; gap: 5px; align-items: center; padding: 0 2px;
    min-width: 0; overflow: hidden;
  }
  #track i {
    width: 10px; height: 10px; flex: none; display: block; border-radius: 50%;
    background: #1c1409cc; box-shadow: inset 0 0 0 2px #efe3c4;
  }
  #track i.pve { border-radius: 2px; transform: rotate(45deg) scale(.86); }
  /* 지나온 라운드는 채워 둔다. 남은 라운드와 대비가 없으면 어디까지 왔는지 모른다. */
  #track i.done { background: #efe3c4; box-shadow: inset 0 0 0 2px #efe3c4; }
  /* 지금 자리. 바깥 고리 두 겹이 9px 점을 15px 로 부풀려 옆 점을 덮었다 —
     한 겹만 두르고 빛으로 띄운다. */
  /* 바깥 빛무리(0 0 8px)를 걸면 10px 점 둘레가 통째로 금색으로 번져,
     마름모 바깥까지 칠해진 것처럼 보인다. 안쪽 테두리만으로 구분한다 —
     이웃이 속 빈 점이라 채워진 것만으로 이미 눈에 띈다. */
  #track i.now { background: var(--gold); box-shadow: inset 0 0 0 2px #ffe9a8; }

  #timer {
    display: flex; align-items: center; gap: 4px; flex: none;
    font-variant-numeric: tabular-nums; font-weight: 800; font-size: 13px; line-height: 16px;
    min-width: 32px; justify-content: flex-end; color: #fff2e0;
    text-shadow: 0 1px 2px #0009;
  }
  #timer::before {
    content: ''; width: 13px; height: 13px; flex: none;
    background: url('/assets/ui/clock.png') center / contain no-repeat;
    image-rendering: pixelated;
  }
  #timer.warn { color: #ff9a7a; animation: pulse .6s steps(2, end) infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  /* 체력·인구는 목재 판에 얹는다 */

  /* 인구는 상단 바 안으로. 우측 세로 자리는 플레이어 목록이 통째로 쓴다. */
  #pop {
    display: flex; align-items: center; gap: 3px; flex: none;
    font-weight: 800; font-variant-numeric: tabular-nums; font-size: 12px; line-height: 16px;
    color: #f3ecdd; text-shadow: 0 1px 2px #0009;
  }
  #pop::before { content: '⬡'; font-size: 11px; opacity: .75; }
  #pop.full { color: #ffa08c; }

  /* ── 좌측: 시너지 ──────────────────────────────────── */
  #traits {
    position: absolute; left: 6px; top: 40px; width: 138px;
    max-height: calc(100% - 80px);
    display: flex; flex-direction: column; gap: 2px; z-index: 4;
    overflow-y: auto; pointer-events: none;
  }
  .trait {
    pointer-events: auto; flex: none; line-height: 1;
    display: flex; align-items: center; gap: 4px; height: 23px; padding: 0 3px 0 0;
    border-style: solid; border-width: 6px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    background: #c58747;
    image-rendering: pixelated;
    font-size: 12px; color: #f0e6cf; text-shadow: 0 1px 2px #0009;
  }
  .trait .n { flex: 1; line-height: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 12px 숫자는 12px 줄상자에 안 들어간다 (실측 15). */
  .trait .c {
    font-variant-numeric: tabular-nums; font-size: 11px; line-height: 14px; color: #cbbfa6;
  }
  .trait.off { opacity: .45; }
  /* 육각 배지 + 등급색. 안에는 시너지 아이콘.
     첫 글자를 쓰던 때는 "거인"과 "전사"가 글자로만 보면 구분이 안 됐다. */
  .trait .pip {
    width: 16px; height: 19px; flex: none;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: var(--ic) center / 13px no-repeat, #4a4458;
    image-rendering: pixelated;
  }
  .trait.s1 .pip { background: var(--ic) center / 13px no-repeat, linear-gradient(#d99154, #a5602c); }
  .trait.s2 .pip { background: var(--ic) center / 13px no-repeat, linear-gradient(#e6edf5, #a8b4c4); }
  .trait.s3 .pip { background: var(--ic) center / 13px no-repeat, linear-gradient(#ffe08a, #d9a12c); }
  .trait.s1 .c { color: #f0b078; }
  .trait.s2 .c { color: #eef4ff; }
  .trait.s3 .c { color: var(--gold); }

  /* ── 우측: 플레이어 ────────────────────────────────── */
  /* 8명이 **전부** 보여야 한다. 스크롤에 밀리면 체력이 깎여 아래로 내려간
     내 줄이 화면 밖으로 나간다. */
  /* 8칸이 무대 높이를 나눠 갖는다. 칸 높이를 박아 두면 하단 UI 를 키울 때마다
     아래쪽 등수가 잘려 나간다 (26×8+틈 = 215 > 무대 176). */
  /* 순위표. **판 하나에 여덟 줄**이다.
     줄마다 9-슬라이스 액자를 두르면 테두리만 여덟 겹이라 우측이 통째로
     계기판이 되고, 강철판(푸른 회색)은 나무로 짠 나머지 UI 와 색조가 어긋난다.
     상단 띠·상점 판과 같은 나무를 쓰고 줄은 선으로만 가른다. */
  /* 순위표. 줄마다 **따로 선 팻말**이고, 폭은 이름 길이를 따라간다.
     고정 폭으로 잡으면 짧은 이름 줄에 빈 나무가 남고, 그 빈 자리가 판을 가린다.
     오른쪽 끝에 맞춰 세우므로 왼쪽 들쭉날쭉이 곧 이름 길이가 된다. */
  #lobby {
    position: absolute; right: 6px; top: 8px; bottom: 42px; z-index: 4;
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
  }
  .seat {
    flex: 0 1 auto; min-height: 0; height: 26px; max-width: 148px;
    display: flex; align-items: center; gap: 4px; padding: 0 0 0 3px;
    border-style: solid; border-width: 6px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    background: #c58747;
    image-rendering: pixelated;
    font-size: 10px; color: #f0e6cf; cursor: pointer;
    text-shadow: 0 1px 2px #0009;
  }

  /* 원형 체력 게이지.
     막대를 따로 두면 8줄 × 막대로 자리를 두 배 먹는다. 초상화 테두리 자체를
     게이지로 쓰면 자리를 하나도 더 안 먹는다 — conic-gradient 가 --hp(0~1)
     만큼 칠하고 나머지는 어둡게 남는다.
     팻말 오른쪽 모서리에 걸치게 둔다. 액자 안(14px)에 넣으면 글자가 안 보인다. */
  .seat .av {
    position: relative; width: 22px; height: 22px; flex: none; border-radius: 50%;
    margin: -4px -3px -4px 0;
    background: conic-gradient(var(--hc, #5fd68a) calc(var(--hp, 1) * 360deg), #1c130ad9 0);
    box-shadow: 0 0 0 1px #00000080;
  }
  .seat .av b {
    position: absolute; inset: 2px; border-radius: 50%;
    display: grid; place-items: center;
    background: #4a3a25; color: #f0e6cf; font-size: 10px; font-weight: 800;
    box-shadow: inset 0 0 0 1px #00000073;
  }
  .seat.me .av b { background: linear-gradient(#ffe08a, #d9a12c); color: #3a2a06; }
  .seat.foe .av b { background: linear-gradient(#ff9a8c, #d9503c); color: #3a1109; }

  .seat .n {
    min-width: 0; line-height: 13px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .seat .h {
    flex: none; font-variant-numeric: tabular-nums; font-weight: 800;
    font-size: 11px; line-height: 14px; color: var(--hc, #5fd68a);
  }

  /* 내 줄에는 이름을 안 적는다 — 내가 누군지는 내가 안다. 초상화와 체력만. */
  .seat.me .n { display: none; }
  .seat.foe .n::after { content: ' ⚔'; color: #ff9a8c; }

  /* 3연승 이상. 초상화를 금빛 고리로 두르고 옅게 떨게 한다 —
     누가 달리고 있는지가 순위(체력)만으로는 안 보인다. 체력이 아직 높은
     사람과 지금 몰아치는 사람은 다른 정보다. */
  .seat.hot .av { box-shadow: 0 0 0 1px #ffd166, 0 0 6px #ffb04dcc; }
  .seat.hot .av b { box-shadow: inset 0 0 0 1px #ffd166a6; }
  .seat.hot .n::before {
    content: '▲'; margin-right: 2px; font-size: 8px; color: #ffd166;
  }
  .seat.hot.me .n::before { color: #7a5306; }

  /* 탈락. 흐리게만 두면 "체력 낮은 사람"과 구분이 안 된다 — 초상화에 ✕ 를 찍는다. */
  .seat.out { filter: grayscale(1) brightness(.72); opacity: .5; cursor: default; }
  .seat.out .av b::after {
    content: '✕'; position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 800; color: #efe3c4;
  }
  .seat.open {
    border-image-slice: 6; background: #e0a94c;
    border-image-source: url('/assets/ui/button_light.png'); color: #4a3a1c;
  }
  .seat.open .n { color: #4a3a1c; }

  /* ── 상세 패널 ─────────────────────────────────────── */
  .panel {
    position: absolute; z-index: 8;
    border-style: solid; border-width: 10px; border-image-slice: 6;
    border-image-repeat: repeat; image-rendering: pixelated;
    border-image-source: url('/assets/ui/panel_wood.png');
    background: #c58747;
    filter: drop-shadow(0 5px 14px #000a);
    font-size: 10px; color: #f0e9dc;
  }
  .panel[hidden] { display: none; }

  /* 무대가 226px 뿐이다. top 80 에서 시작하면 능력치 표 아래가 잘린다. */
  /* 화면 **우측 끝**에 붙인다. 가운데에 띄우면 판 한복판을 덮어 정작
     비교하려던 말들이 가려진다 — 카드를 여는 이유가 "이 말을 어디에 둘까"
     인데 판이 안 보이면 답을 못 낸다. 우측 순위표를 가리는 대가가 더 싸다:
     순위표는 카드를 닫으면 그대로 있고, 배치 중에 계속 볼 값도 아니다. */
  #info {
    right: 6px; top: 44px; width: 196px; --pc: var(--tc, #6f7fd8);
    /* 위 44 + 하단 HUD 32 + 여유. 3성에 아이템 3개를 낀 최대 카드가
       스크롤 없이 들어가는 높이다 — 잘리면 판매가가 안 보인다. */
    max-height: calc(100% - 84px); overflow-y: auto;
  }
  #info .hd {
    display: flex; align-items: center; gap: 6px; padding: 1px 0 4px;
    border-bottom: 1px solid #00000040;
  }
  #info .hd img { width: 24px; height: 24px; object-fit: contain; flex: none; }
  #info .hd .t { flex: 1; min-width: 0; }
  #info .hd .nm { font-weight: 800; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #info .hd .sub { font-size: 9px; color: #b3a894; }
  #info .hd .st { color: var(--sc); font-size: 11px; letter-spacing: -1px; }
  #info .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8px;
    padding: 3px 0; border-top: 1px solid #ffffff1a; font-variant-numeric: tabular-nums;
    font-size: 11px; line-height: 13px;
  }
  #info .grid span { color: #b3a894; }
  #info .grid b { float: right; font-weight: 700; color: #fff6e4; }
  /* 스킬 설명은 문장이라 가장 길다 — 여기가 제일 커 보였다. */
  #info .sk {
    padding: 3px 0; border-top: 1px solid #ffffff1a;
    font-size: 9px; line-height: 1.25; color: #e6dcc8;
  }
  #info .sk em { color: #8fd8ff; font-style: normal; font-weight: 700; }
  /* 아이템 한 줄에 아이콘 · 이름 · 효과 (스펙 §8) — 효과까지 넣으니 가로로
     못 묶는다. 3칸을 세로로 쌓는다. */
  #info .items { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
  #info .items span {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; line-height: 13px; color: var(--ink);
    background: #ffffff1f; border-radius: 3px; padding: 1px 4px;
    /* 3칸을 다 껴도 카드가 안 넘치게 한 줄로 못 박는다 — 줄바꿈이 생기면
       "거인의 심 / 장" 처럼 이름이 두 동강 난다. */
    white-space: nowrap;
  }
  #info .items img { width: 12px; height: 12px; image-rendering: pixelated; flex: none; }
  /* 아이템 카드의 큰 아이콘. 초상화 자리를 그대로 쓴다 — 16px 원본이라
     늘리면 뭉개지므로 픽셀 그대로 확대한다. */
  #info .hd img.itemart { image-rendering: pixelated; object-fit: contain; padding: 4px; }
  #info .items b {
    color: #fff6e4; font-weight: 700;
    min-width: 0; overflow: hidden; text-overflow: ellipsis;
  }
  #info .items em {
    font-style: normal; margin-left: auto; padding-left: 5px; flex: none;
    color: var(--gold); font-weight: 700;
  }
  #info .sell { padding: 2px 0 0; border-top: 1px solid #ffffff1a; color: #d8ceba; font-size: 9px; }
  #info .sell b { color: var(--gold); }
  #info .sell b::before,
  #streak .bn::before {
    content: ''; display: inline-block; vertical-align: -1px;
    width: 10px; height: 10px; margin-right: 2px;
    background: url('/assets/ui/coin.png') center / contain no-repeat;
    image-rendering: pixelated;
  }

  /* 무대보다 길어지면 아래쪽 유닛 목록이 통째로 잘린다 — 그걸 보라고 만든 패널이다. */
  /* 시너지 상세. 판 위에 뜨는 참고 패널이라 크면 판을 통째로 가린다.
     **스크롤을 걸지 않는다** — 참고 패널을 굴려 가며 읽게 만들면 그 사이
     마우스가 패널을 벗어나 닫힌다. 대신 가장 큰 경우(7명 · 3단계)가
     그대로 들어가는 크기로 잡는다. */
  #traitinfo {
    left: 146px; top: 46px; width: 162px;
    font-size: 10px; line-height: 13px;
  }
  #traitinfo .hd {
    display: flex; align-items: center; gap: 4px; padding: 0 0 3px;
    border-bottom: 1px solid #00000040; font-weight: 800; font-size: 11px;
  }
  #traitinfo .hd::before {
    content: ''; flex: none; width: 13px; height: 13px;
    background: var(--ic) center / contain no-repeat;
    image-rendering: pixelated;
  }
  #traitinfo .hd .c { margin-left: auto; color: var(--gold); font-variant-numeric: tabular-nums; }
  #traitinfo .steps { padding: 3px 0; display: flex; flex-direction: column; gap: 1px; }
  #traitinfo .step { display: flex; gap: 5px; line-height: 1.15; opacity: .45; }
  #traitinfo .step.on { opacity: 1; }
  #traitinfo .step b { flex: none; width: 12px; text-align: right; color: #cbbfa6; }
  #traitinfo .step.on b { color: var(--gold); }
  /* 유닛 목록. 필요한 건 **몇 티어이고 어떻게 생겼나** 둘뿐이다 —
     이름표를 빼고 테두리 색으로 티어를 말한다 (상점 카드 이름띠와 같은 색). */
  #traitinfo .mem { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px 0 0; border-top: 1px solid #ffffff1a; }
  #traitinfo .mem figure {
    position: relative; width: 26px; height: 26px; border-radius: 4px;
    background: color-mix(in srgb, var(--tc) 24%, #1a1420);
    box-shadow: inset 0 0 0 1px var(--tc);
  }
  #traitinfo .mem img { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* 티어 숫자. 색만으로는 4티어(보라)와 5티어(금)를 헷갈린다. */
  #traitinfo .mem figcaption {
    position: absolute; right: -1px; bottom: -1px;
    min-width: 10px; height: 10px; padding: 0 1px; border-radius: 3px;
    background: var(--tc); color: #14101c;
    font-size: 8px; line-height: 10px; font-weight: 800; text-align: center;
  }
  #traitinfo .mem figure.no { filter: grayscale(1) brightness(.5); }
  /* 짚은 유닛 이름. 아무것도 안 짚었을 때도 자리를 남긴다 — 줄이 생겼다
     사라지면 패널 높이가 튀어 마우스가 패널 밖으로 떨어진다. */
  #traitinfo .pick {
    display: flex; align-items: center; gap: 4px;
    /* min-height 로 두면 글자가 들어올 때 4px 늘어난다. 패널 높이가 튀면
       아래쪽에 있던 마우스가 패널 밖으로 떨어져 패널이 닫힌다. 못 박는다. */
    height: 14px; margin-top: 3px; padding-top: 3px;
    border-top: 1px solid #ffffff1a;
    font-size: 10px; line-height: 14px; font-weight: 700; color: #f0e6cf;
  }
  #traitinfo .pick .t {
    flex: none; min-width: 12px; height: 11px; border-radius: 3px;
    background: var(--tc, #6a6252); color: #14101c;
    font-size: 8px; line-height: 11px; font-weight: 800; text-align: center;
  }

  #hint {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 9;
    padding: 5px 14px; border-radius: 20px;
    background: rgba(0,0,0,.78); color: var(--ink); font-size: 12px;
    pointer-events: none; opacity: 0; transition: opacity .18s;
  }
  #hint.show { opacity: 1; }

  /* ── 정보 줄 (판 위에 뜬다) ────────────────────────── */
  /* 레벨 · 확률 · 골드 · 연승 · 잠금은 **상점 판 안에 넣지 않는다.**
     같은 갈색 판에 묶으면 "상점의 일부"로 읽히는데, 이건 내 상태지
     상점 물건이 아니다. 판 위에 각자 자기 틀을 쓰고 뜬다. */
  /* 좌 · 중 · 우 세 칸. flex 로 늘어놓으면 왼쪽 것들 폭에 따라 골드가 흔들린다 —
     골드는 화면 정가운데에 고정돼야 눈이 매번 같은 자리를 본다. */
  /* 무대 안에 띄우면 3D 대기석을 덮는다. 무대와 상점 판 **사이**의 제 줄이다.
     상점 판(갈색) 안에는 넣지 않는다 — 이건 내 상태지 상점 물건이 아니다. */
  /* 무대 **위에 뜬다.** 무대 밖에 띠로 두면 그 48px 이 통째로 남색 벽이 되어
     바로 뒤에 있는 대기석을 가린다. 값 넷을 앉히자고 판을 잘라 먹는 셈이다.
     바탕은 투명, 글자만 뜬다 — 아래쪽에 옅은 그늘만 깔아 3D 위에서도 읽히게. */
  #hudbar {
    position: absolute; left: 6px; right: 6px; bottom: 0; height: 32px; z-index: 6;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    pointer-events: none;
  }
  /* 누를 수 있는 것만 포인터를 받는다 — 나머지는 뒤의 판을 그대로 집게 둔다. */
  #lock { pointer-events: auto; }
  #hudL { display: flex; align-items: center; gap: 6px; justify-self: start; }
  /* 골드가 절대 배치(가운데)라 흐름으로는 오른쪽 칸이 안 밀린다.
     잠금도 같이 못 박아 화면 오른쪽 끝에 붙인다. */
  #hudR {
    position: absolute; right: 0; display: flex; align-items: center; gap: 6px;
  }
  /* 확률 · 골드 · 연승은 **한 덩어리**로 가운데. 같은 질문("지금 뭘 살 수 있나")에
     답하는 값들이라 눈이 한 번만 가야 한다. */
  /* 골드는 흐름에서 빼서 화면 정가운데에 못 박는다. 격자의 auto 칸에 두면
     좌측 묶음(레벨+확률)이 자기 몫보다 넓어지는 순간 골드가 그만큼 밀린다 —
     700px 폭에서 실제로 9px 밀렸다. */
  #hudC {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center;
  }
  #hudC #streak { position: absolute; left: 100%; margin-left: 8px; }

  /* 레벨 · 확률 · 골드는 각자 자기 틀 안에 든다. 3D 판 위에 글자만 떠 있으면
     밝은 타일에서 값이 묻힌다. 틀은 상점 판과 같은 나무 — 하단이 한 벌로 읽힌다.
     9-슬라이스 6px 이 사방을 먹으므로 높이는 그만큼 더 잡는다. */
  #lvbox, #odds, #gold {
    /* 700px 폭에서는 가운데 칸(골드)이 양옆을 눌러 'Lv 7' 과 'XP 0/30' 이
       두 줄로 접혔다. 접히지 않게 못 박는다 — 접히면 30px 틀을 뚫는다. */
    height: 26px; align-items: center; white-space: nowrap;
    border-style: solid; border-width: 6px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    background: #c58747;
    image-rendering: pixelated;
  }

  /* 레벨 · 확률 · 골드 · 연패는 **틀 없이** 둔다.
     각자 9-슬라이스 판을 두르면 한 줄에 상자가 넷 늘어서서, 값이 아니라
     상자들이 먼저 읽힌다. 값 자체가 크고 색이 다르므로 틀이 없어도 갈린다.
     테두리가 필요한 건 **누를 수 있는 것**(잠금 버튼)뿐이다. */
  #lvbox { display: flex; gap: 5px; padding: 0 2px; }
  #lvl {
    font-size: 13px; font-weight: 800; color: #fff2d8; line-height: 16px; white-space: nowrap;
    text-shadow: 0 1px 2px #0009;
  }
  #lvl::before { content: 'Lv '; font-size: 9px; font-weight: 700; color: #cbbfa6; }
  /* 한 줄로 눕힌다. 22px 안쪽에 두 줄을 넣으면 9px 글자가 되어 안 읽힌다. */
  #xprow { display: flex; align-items: center; }
  /* 막대는 뺐다. 0% 일 때 가운데를 가로지르는 선으로만 읽힌다. */
  #xpbar { display: none; }
  #xptext {
    font-size: 11px; line-height: 16px; color: #8fd8ff; font-weight: 800;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #0009;
  }
  #xptext::before { content: 'XP '; font-size: 9px; color: #cbbfa6; font-weight: 700; }

  /* 티어 확률. 참고용 숫자다 — 크게 잡으면 상점 카드보다 눈에 먼저 든다. */
  /* 색은 보석이 나르고 숫자는 배경 없이 읽힌다.
     보석 그림을 **마스크로** 쓴다 — 팩에 보라(4티어)가 없어서 색깔별 타일을
     골라 쓸 수가 없다. 모양은 에셋에서, 색은 티어에서 온다. */
  #odds { display: flex; gap: 2px; padding: 0 2px; }
  #odds span {
    display: flex; align-items: center; gap: 2px;
    font-size: 9px; line-height: 9px; font-weight: 800;
    font-variant-numeric: tabular-nums; color: #f0e6cf; text-shadow: 0 1px 2px #0009;
  }
  #odds span i {
    width: 9px; height: 9px; flex: none; background: var(--oc);
    -webkit-mask: url('/assets/ui/gem.png') center / contain no-repeat;
    mask: url('/assets/ui/gem.png') center / contain no-repeat;
  }
  /* 자릿수가 달라 폭이 흔들리면 다섯 칸이 줄을 안 선다. 폭을 못 박고 가운데. */
  #odds span b {
    width: 18px; text-align: center; font-weight: 800;
  }
  #odds span.zero { color: #8d8371; }
  #odds span.zero i { background: #6b6353; opacity: .5; }

  #gold {
    display: flex; gap: 4px; padding: 0 6px 0 4px; line-height: 18px;
    font-size: 15px; font-weight: 800; color: #ffe08a; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px #0009;
  }
  #gold::before {
    content: ''; width: 13px; height: 13px; flex: none;
    background: url('/assets/ui/coin.png') center / contain no-repeat;
    image-rendering: pixelated;
  }

  /* 연승·연패. 다음 라운드 수입이 이걸로 갈리는데 화면에 없었다. */
  /* 연승·연패. 다음 라운드 수입이 여기서 갈린다.
     min-width 를 주는 이유: 연승이 붙는 순간 골드가 옆으로 밀리면
     눈이 매번 골드를 다시 찾아야 한다. */
  #streak {
    display: flex; align-items: center; gap: 3px; min-width: 52px;
    font-size: 12px; line-height: 16px; font-weight: 700; white-space: nowrap;
    text-shadow: 0 1px 2px #000, 0 0 4px #0009;
  }
  #streak::before { font-size: 10px; }
  #streak.none::before { content: ''; }
  #streak.win { color: #8ff0bb; }
  #streak.win::before { content: '\25B2'; }
  #streak.lose { color: #ffa8b3; }
  #streak.lose::before { content: '\25BC'; }
  #streak b { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 800; }
  #streak .bn { color: var(--gold); }

  #lock {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 30px;
    border-style: solid; border-width: 6px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/button.png');
    background: #c58747;
    image-rendering: pixelated;
    font-size: 11px; font-weight: 700; color: #f3ecdd; text-shadow: 0 1px 2px #0009;
  }
  #lock::before {
    content: ''; width: 16px; height: 16px; flex: none;
    background: url('/assets/ui/lock_open.png') center / contain no-repeat;
    image-rendering: pixelated;
  }
  #lock.on { border-image-source: url('/assets/ui/button_light.png'); background: #e0a94c; }
  #lock.on::before { background-image: url('/assets/ui/lock_closed.png'); }

  /* ── 상점 판 ───────────────────────────────────────── */
  /* 이 판에는 **살 것만** 들어간다. 카드와 그걸 굴리는 버튼 둘. */
  #shopbar {
    flex: none; height: var(--shopH);
    display: flex; align-items: stretch; gap: 6px;
    border-style: solid; border-width: 12px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    background: #c58747;
    image-rendering: pixelated;
    transition: filter .12s;
  }
  #shopbar.selling { filter: hue-rotate(-25deg) saturate(1.8) brightness(1.15); }

  #sidebtns { width: 138px; flex: none; display: flex; flex-direction: column; gap: 6px; }
  .btn {
    flex: 1; line-height: 1;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    /* fill 을 안 쓴다. button.png 은 테두리 6px 이 밝은 갈색(197,135,71)이고
       가운데가 어두운 갈색(163,112,58)이다 — 원본의 입체감인데, 넓은 버튼에
       늘리면 그 면이 "반투명 검정 네모"로 읽힌다. 안쪽은 테두리 색으로 채운다. */
    border-style: solid; border-width: 6px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/button.png');
    background: #c58747;
    image-rendering: pixelated;
    font-size: 13px; font-weight: 700; color: #f3ecdd; text-shadow: 0 1px 2px #0009;
  }
  .btn .cost {
    /* 13px 글자에 13px 줄상자면 2px 모자란다 (실측 15). 명시한다. */
    flex: none; line-height: 16px;
    display: flex; align-items: center; gap: 3px;
    color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .btn .cost::before {
    content: ''; width: 12px; height: 12px; flex: none;
    background: url('/assets/ui/coin.png') center / contain no-repeat;
    image-rendering: pixelated;
  }
  /* 단축키 표시. 버튼을 누르러 가는 손이 키를 배우게 하는 가장 싼 방법이다 —
     따로 도움말을 두면 아무도 안 연다. */
  .btn .kb {
    /* 흐름 안에 둔다. 절대 배치로 얹으면 가운데 정렬된 글자 위에 겹친다. */
    flex: none; min-width: 13px; height: 13px; padding: 0 2px; border-radius: 3px;
    background: #efe3c4; color: #4a3a1c;
    font-size: 9px; line-height: 13px; font-weight: 800; text-align: center;
  }
  .btn:disabled .kb { opacity: .45; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { filter: grayscale(.7) brightness(.62); cursor: default; }

  /* 정사각. 가로로 길면 초상화가 납작해져 무슨 몬스터인지 안 읽힌다.
     남는 폭은 가운데 정렬로 흘린다 — 늘려서 채우면 다시 직사각이 된다. */
  #shop { flex: 1; display: flex; gap: 5px; min-width: 0; }

  /* 카드. 나무 액자를 두르지 않는다 — 6px 9-슬라이스가 사방을 먹어
     78px 카드에서 실제 그림 자리가 66px 밖에 안 남았다. 대신 **아트가 카드
     전체를 채우고**, 정보는 그 위에 얹는다:
       좌상단  특성 두 줄 (어두운 스크림 위)
       하단 띠  이름 왼쪽 · 값 오른쪽, 띠 색이 곧 티어
     참고한 오토체스 상점이 쓰는 배치다. 액자 대신 티어색이 테두리 노릇을 한다. */
  .card {
    --tc: var(--t1);
    flex: 1; min-width: 0; position: relative; overflow: hidden;
    border-radius: 3px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 26%, #15121d), #0c0a12);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 45%, transparent), 0 2px 5px #000a;
  }
  /* 위쪽 후광. 어두운 모델이 어두운 판에 묻히는 걸 막는다. */
  .card::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 72% at 50% 4%, color-mix(in srgb, var(--tc) 46%, transparent), transparent 76%);
  }
  .card.empty { --tc: #6a6252; opacity: .28; }
  .card.empty::before { display: none; }
  .card:not(.empty):active { transform: translateY(1px); }

  /* 이미 갖고 있는 말인지, 사면 승급하는지.
     이게 없으면 두 장 모아 둔 말과 처음 보는 말이 카드에서 똑같이 생겼다. */
  .card .own {
    position: absolute; right: 2px; top: 2px; z-index: 3;
    height: 14px; padding: 0 4px; border-radius: 7px;
    display: flex; align-items: center;
    background: #e8dcc0; color: #2a1d08;
    box-shadow: 0 1px 3px #000a;
    font-size: 9px; line-height: 14px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  /* 승급은 별 색으로 — 은(2성) · 금(3성). 셋을 모으는 게 이 게임의 목표라
     카드 테두리까지 같이 밝힌다. */
  .card .own.up {
    height: 15px; padding: 0 5px; letter-spacing: -1px;
    background: var(--sc); color: #2a1d08;
    box-shadow: 0 0 6px var(--sc), 0 1px 3px #000a;
  }
  .card.up { box-shadow: inset 0 0 0 2px var(--sc), 0 0 10px color-mix(in srgb, var(--sc) 55%, transparent); }
  .card.poor { filter: grayscale(.55) brightness(.7); }

  .card .art { position: absolute; left: 0; right: 0; top: 0; bottom: 22px; z-index: 1; }
  .card .art img {
    width: 100%; height: 100%; object-fit: contain;
    /* 그림 자리는 128×50 인데 섬네일은 정사각이다 — contain 이면 세로에 맞춰
       50px 폭만 쓰고 좌우 78px 이 통째로 빈다. 키워서 넘치게 두고 카드가
       잘라 낸다 (참고한 상점도 아트를 잘라 쓴다). 발밑은 이름띠가 덮는다. */
    transform: scale(1.62) translateY(6%);
    filter: drop-shadow(0 3px 5px #000b);
  }

  /* 특성은 좌상단에 세로로. 검은 스크림을 깔면 카드 왼쪽이 통째로 어두워져
     초상화 절반이 그늘에 들어간다 — 대신 아이콘을 앞에 세우고 글자에 그림자를
     세게 준다. 아이콘이 있으니 글자가 조금 묻혀도 무엇인지 읽힌다. */
  .card .tr {
    position: absolute; left: 0; top: 0; z-index: 2;
    display: flex; flex-direction: column; gap: 1px;
    padding: 2px 6px 3px 2px;
    font-size: 9px; line-height: 12px; font-weight: 700; color: #f0e6cf;
    letter-spacing: -.2px;
    text-shadow: 0 1px 2px #000, 0 0 4px #000, 0 0 6px #000;
  }
  .card .tr i {
    display: flex; align-items: center; gap: 3px; font-style: normal;
    white-space: nowrap;
  }
  .card .tr i::before {
    content: ''; flex: none; width: 11px; height: 11px;
    background: var(--ic) center / contain no-repeat;
    image-rendering: pixelated;
    filter: drop-shadow(0 1px 1px #000);
  }

  /* 하단 띠 = 이름 + 값. 티어색이 여기에만 진하게 들어간다. */
  .card .nm {
    position: absolute; left: 0; right: 0; bottom: 0; height: 22px; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    padding: 0 5px;
    /* 진짜 반투명. 불투명한 색끼리 섞으면(#0c0a12cc 처럼 알파가 있어도)
       결과 알파가 0.9 를 넘어 아무것도 안 비친다 — transparent 와 섞는다.
       불투명하면 초상화 발밑이 통째로 잘려 나간다. */
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--tc) 40%, transparent),
      color-mix(in srgb, var(--tc) 22%, transparent));
    box-shadow: inset 0 1px 0 #ffffff2e;
    font-size: 11px; line-height: 22px; font-weight: 800; color: #fff;
    letter-spacing: -.3px; text-shadow: 0 1px 2px #000, 0 0 4px #000c;
  }
  .card .nm b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .pr {
    flex: none; display: flex; align-items: center; gap: 2px;
    color: #ffe6a8; font-variant-numeric: tabular-nums;
  }
  .card .pr::before {
    content: ''; width: 11px; height: 11px; flex: none;
    background: url('/assets/ui/coin.png') center / contain no-repeat;
    image-rendering: pixelated;
  }

  /* ── 전투 조작 ─────────────────────────────────────── */
  .teamA { color: var(--team-a); }
  .teamB { color: var(--team-b); }

  /* ── 드래그 유령 ───────────────────────────────────── */
  #ghost {
    position: fixed; width: 56px; height: 56px; pointer-events: none;
    z-index: 50; display: none; transform: translate(-50%, -62%);
  }
  #ghost img { width: 100%; height: 100%; object-fit: contain; }
  #ghost.sell { filter: drop-shadow(0 0 7px var(--sell)); }

  #rotate {
    display: none; position: fixed; inset: 0; z-index: 90;
    background: var(--bg); color: var(--dim);
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  @media (orientation: portrait) { #rotate { display: flex; } }

  /* 부팅 — 리소스를 **전부** 받고 나서 게임을 연다. 중간에 받으면 상점 카드가
     빈 채로 뜨고 말이 한 박자 늦게 나타난다. */
  /* ── 메인화면 ─────────────────────────────────────
     부팅이 끝나면 바로 게임이 아니라 여기가 뜬다. 모드(일반/랭크)를
     고르는 곳이라 없으면 매칭이란 개념 자체가 설 자리가 없다.
     판 위에 겹치는 오버레이다 — 무대(3D)는 뒤에서 이미 그려져 있어
     배경으로 쓴다. 따로 배경 그림을 만들면 로딩만 는다. */
  /* 홈은 로비다 — 왼쪽 패널이 메뉴와 전적을 쥐고, 오른쪽은 무대를 보여 준다.
     무대(3D)는 이미 그려져 있으므로 배경 그림을 따로 만들지 않는다. */
  /* #viewport 안에 있다 — 밖에 두면 812×390 설계 상자를 안 타고 실제 창
     가장자리에 붙어, 패널 152px 이 화면 크기마다 다른 비율로 보인다.

     배경은 그림 파일이 아니라 CSS 다. 간판 캐릭터 뒤에 따뜻한 빛무리를 깔고
     위아래를 어둡게 눌러 시선이 가운데로 모이게 한다 — 사진 한 장을 깔면
     용량이 늘고 화면비마다 잘리는 데가 달라진다. */
  /* ── 가상 조이스틱 ─────────────────────────────────
     짚은 자리에 뜬다. 화면 구석에 고정하면 상점·순위표와 겹치고, 세로 390 에
     자리를 새로 내면 판이 그만큼 작아진다. */
  .stick {
    position: absolute; width: 104px; height: 104px; margin: -52px 0 0 -52px;
    border-radius: 50%; z-index: 6; pointer-events: none;
    background: #ffffff0f; box-shadow: inset 0 0 0 2px #ffffff33, 0 4px 14px #0006;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .stick[hidden] { display: none; }
  .stick .knob {
    position: absolute; left: 50%; top: 50%; width: 42px; height: 42px;
    border-radius: 50%; background: #ffd166cc; box-shadow: 0 2px 8px #0008;
  }

  /* ── 튜토리얼 코치 ─────────────────────────────────
     말풍선은 **판을 가리지 않는 자리**에 둔다. 가운데에 띄우면 정작 시키는
     것(상점 카드·판)을 자기가 덮는다. */
  /* 무대 **위쪽**에 둔다. 아래에 두면 대기석(무대 바닥 42px)을 덮어, 방금
     산 말이 어디로 갔는지 안 보인다 — 그걸 가리키는 단계에서 최악이다. */
  #coach {
    position: absolute; left: 0; right: 0; top: 40px; z-index: 60;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    pointer-events: none;
  }
  #coach[hidden] { display: none; }
  /* 반투명이라 뒤의 판이 비친다 — 코치가 화면을 뺏는 게 아니라 얹혀 있다는
     인상이 된다. 나무 액자를 쓰면 불투명해져서 그 인상이 안 난다. */
  #coach .bubble {
    position: relative;
    display: flex; align-items: center; gap: 10px; max-width: 470px;
    padding: 9px 13px 9px 11px; pointer-events: auto;
    border-radius: 10px;
    background: linear-gradient(#1b1428d9, #120d1ce6);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    box-shadow:
      inset 0 0 0 1px #ffd16659,
      inset 0 1px 0 #ffffff1f,
      0 6px 18px #000000a6;
    font-size: 13px; line-height: 1.4; color: #f6ead0; text-shadow: 0 1px 2px #000a;
  }
  /* 말풍선 꼬리. 위쪽에서 내려온 말이라는 걸 도형 하나로 말한다. */
  #coach .bubble::before {
    content: ''; position: absolute; left: 26px; top: -6px;
    border-left: 7px solid transparent; border-right: 7px solid transparent;
    border-bottom: 7px solid #1b1428e6;
  }
  /* 말하는 이 표시. 금빛 점 하나면 "누가 말하고 있다"가 읽힌다. */
  #coach .bubble .mark {
    flex: none; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe9a8, #e0a338);
    box-shadow: 0 0 8px #ffd16688;
    animation: coachdot 1.6s ease-in-out infinite;
  }
  @keyframes coachdot { 50% { opacity: .45; } }
  #coach #coach-fight,
  #coach #coach-home {
    flex: none; padding: 5px 12px; font-size: 13px; font-weight: 800; color: #3b2a16;
    border-style: solid; border-width: 8px; border-image-slice: 8 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/lobby_btn.png');
    text-shadow: 0 1px 0 #ffffff88; image-rendering: pixelated;
  }
  #coach #coach-fight[hidden], #coach #coach-home[hidden] { display: none; }
  /* 건너뛰기는 눈에 덜 띄어야 한다 — 시키는 것과 같은 무게로 두면 그걸 먼저 누른다. */
  #coach #coach-skip {
    flex: none; margin-left: 2px; padding-left: 10px;
    font-size: 10px; color: #a99a86; box-shadow: inset 1px 0 0 #ffffff1a;
  }
  #coach #coach-skip:hover { color: #e6cfa2; }
  /* 지금 눌러야 할 곳. 화살표를 그리는 대신 대상 자체를 밝힌다 —
     화살표는 화면 크기가 바뀌면 엉뚱한 데를 가리킨다. */
  .coach-lit {
    animation: coachpulse 1.1s ease-in-out infinite;
    outline: 2px solid #ffd166; outline-offset: 2px; border-radius: 4px;
  }
  @keyframes coachpulse {
    50% { outline-color: #ffd16655; }
  }

  /* 배경은 그림 한 장이다. 도형과 실루엣 조각으로 짜 맞추던 것을 걷어냈다 —
     조각은 아무리 맞춰도 "스티커 붙인" 인상이 남고, 화면 폭이 700~1040 으로
     변할 때마다 조각들 사이 간격이 따로 논다. 그림은 가운데가 비어 있어
     좌우가 잘려도 캐릭터 자리는 안 흔들린다 (cover + center).
     1.6MB PNG 를 WebP 로 구워 51KB 다 (tools/build-ui-rpg.mjs). */
  #home {
    position: absolute; inset: 0; z-index: 70; overflow: hidden;
    background: #150f22 url('/assets/home/bg_scene.webp') center / cover no-repeat;
  }
  #home[hidden] { display: none; }
  /* 메뉴를 감싸던 나무 판을 걷어냈다. 판은 배경 그림을 왼쪽에서 잘라 먹었고,
     정작 그 안에 든 건 버튼 셋뿐이라 액자만 무거웠다. 버튼은 자기 액자를
     이미 갖고 있다. */
  #home .lobby-panel {
    position: absolute; left: 22px; top: 50%; transform: translateY(-50%);
    /* 간판 캐릭터(z 없음)보다 위. 말풍선이 드래곤 뒤로 들어가면 안 읽힌다. */
    z-index: 4;
    display: flex; flex-direction: column; gap: 8px; width: 176px;
  }
  /* 간판. 게임 이름은 화면에서 가장 큰 글자여야 한다 — 로비에 처음 들어온
     사람이 "무슨 게임인가"를 먼저 읽는다. */
  /* 좌우를 프로필 카드(왼쪽 22+176)와 접속 상태(오른쪽)만큼 비워 두고 그
     안에서 가운데 정렬한다. left:0/right:0 으로 두면 폭 700 에서 38px 제목이
     카드 위로 올라탄다 — 화면이 넓을 때만 안 겹치는 건 안 겹치는 게 아니다. */
  #home .title {
    position: absolute; left: 208px; right: 208px; top: 20px; text-align: center;
    font-size: 38px; font-weight: 900; letter-spacing: 3px; line-height: 1;
    color: #ffe1a0;
    text-shadow:
      0 2px 0 #7a4a1e, 0 4px 0 #4a2a10,
      0 0 22px #ff9a3c66, 0 8px 24px #000c;
    pointer-events: none;
  }
  /* 이름 아래 가는 금선. 글자만 있으면 하늘에 떠 있는 것처럼 보인다. */
  #home .title::after {
    content: ''; display: block; width: 210px; height: 2px; margin: 8px auto 0;
    background: linear-gradient(90deg, #ffd16600, #ffd166aa, #ffd16600);
  }
  #home .menu { position: relative; display: flex; flex-direction: column; gap: 6px; }
  #home .menu[hidden] { display: none; }
  /* fill 을 쓴다 — 이 버튼은 가운데도 그림이라, 안 쓰면 속이 비어 글자만 뜬다. */
  #home .btn-home {
    height: 40px; font-size: 15px; font-weight: 800; text-align: center; padding: 0 12px;
    border-style: solid; border-width: 10px; border-image-slice: 10 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/lobby_btn.png');
    background: transparent; color: #3b2a16; text-shadow: 0 1px 0 #ffffff88;
    letter-spacing: .5px; image-rendering: pixelated;
  }
  #home .btn-home:active { border-image-source: url('/assets/ui/lobby_btn_down.png'); }
  /* ── 첫 실행 유도 ───────────────────────────────────
     처음 온 사람에게 고를 것을 하나로 줄인다. 나머지를 덮어 두면 "무엇부터
     눌러야 하나"라는 질문 자체가 안 생긴다. 자동 진입과 다른 점: 언제든
     닫고 둘러볼 수 있다. */
  #home .veil {
    position: absolute; inset: 0; z-index: 8; display: none;
    background: #05030ad9;
  }
  #home.guiding .veil { display: block; }
  /* 패널을 덮개 위로 올린다. 패널 자체가 쌓임 맥락이라 버튼만 올릴 수는 없다. */
  #home.guiding .lobby-panel { z-index: 9; }
  /* 튜토리얼만 남기고 전부 죽인다 — 보이되 안 눌린다. */
  #home.guiding .btn-home:not(.is-new),
  #home.guiding .btn-sub { opacity: .3; pointer-events: none; }
  #home.guiding .record,
  #home.guiding .pass,
  #home.guiding .conn { opacity: .35; pointer-events: none; }

  /* 튜토리얼 버튼 옆 말풍선. 버튼 묶음 기준으로 붙여 화면 크기가 바뀌어도
     가리키는 곳이 안 어긋난다 — 좌표를 손으로 박으면 반드시 어긋난다. */
  #home .firsthint {
    position: absolute; left: 100%; bottom: 0; margin-left: 10px;
    display: flex; align-items: center; gap: 2px; white-space: nowrap;
    padding: 5px 6px 5px 10px; border-radius: 9px;
    background: #1b1428d9; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    box-shadow: inset 0 0 0 1px #ffd16659, 0 6px 16px #000a;
    animation: hintin .3s ease-out;
  }
  #home .firsthint[hidden] { display: none; }
  /* 버튼 쪽을 가리키는 꼬리 */
  #home .firsthint::before {
    content: ''; position: absolute; left: -6px; bottom: 13px;
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
    border-right: 6px solid #1b1428d9;
  }
  #home .firsthint .go { font-size: 11px; font-weight: 800; color: #ffe1a0; }
  #home .firsthint .x { font-size: 11px; color: #8d8172; padding: 0 4px; }
  #home .firsthint .x:hover { color: #e6cfa2; }
  @keyframes hintin { from { opacity: 0; transform: translateX(-6px); } }

  /* 아직 안 본 튜토리얼. 자동으로 밀어 넣는 대신 눈에 띄게만 한다. */
  #home .btn-home.is-new { position: relative; }
  #home .btn-home.is-new::after {
    content: '처음이라면'; position: absolute; right: -6px; top: -9px;
    padding: 1px 6px; border-radius: 8px;
    background: #e0a338; color: #2a1c08; font-size: 9px; font-weight: 900;
    box-shadow: 0 2px 6px #0008;
    animation: coachdot 1.8s ease-in-out infinite;
  }
  #home .btn-home[disabled] { filter: grayscale(.6) brightness(.85); cursor: default; }
  /* 대기 중에는 메뉴가 사라지고 이 줄이 그 자리를 쓴다 — 누를 수 있는 것과
     기다리는 중이 한 화면에 같이 있으면 지금 뭘 하는 중인지 흐려진다. */
  #home .queue {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: #e6cfa2;
  }
  #home .queue[hidden] { display: none; }
  #home .queue button {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: #00000055; box-shadow: inset 0 0 0 1px #ffffff2a; color: #ffb3a6;
  }
  /* 반투명 띠. 코치 말풍선과 같은 말투를 쓴다 — 화면에 얹힌 정보는 다 같은
     재질이어야 어느 것이 그림이고 어느 것이 UI 인지 헷갈리지 않는다. */
  #home .record {
    position: absolute; left: 22px; top: 16px; width: 176px; z-index: 4;
    padding: 8px 10px; border-radius: 9px; white-space: nowrap;
    font-size: 10px; line-height: 1.4; color: #f0dcb4;
    background: #140e1cbf; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    box-shadow: inset 0 0 0 1px #ffd16640;
  }
  #home .record .tierline { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  #home .record .tierline b { color: #ffe1a0; font-weight: 900; }
  #home .record .tierline span { margin-left: auto; font-size: 11px; color: #c9b088; }
  /* 티어 배지. 색만으로 단계를 말한다 — 아이콘 다섯 장을 새로 그리면 그림이
     티어 수치와 어긋날 자리가 하나 더 생긴다. */
  #home .record .badge {
    width: 14px; height: 14px; flex: none; border-radius: 3px;
    transform: rotate(45deg); box-shadow: inset 0 0 0 2px #00000055;
  }
  #home .record .badge.bronze { background: linear-gradient(#d08a4e, #8a5527); }
  #home .record .badge.silver { background: linear-gradient(#dfe6ef, #9aa6b6); }
  #home .record .badge.gold { background: linear-gradient(#ffd977, #c99326); }
  #home .record .badge.platinum { background: linear-gradient(#a8f0e2, #3f9f8e); }
  #home .record .badge.diamond { background: linear-gradient(#bfe2ff, #5a8fe0); }
  /* 다음 티어까지. 숫자만 있으면 "많이 남았나"를 매번 계산해야 한다. */
  #home .record .bar {
    height: 4px; margin: 6px 0 5px; border-radius: 2px; overflow: hidden;
    background: #00000066; box-shadow: inset 0 0 0 1px #ffffff1a;
  }
  #home .record .bar[hidden] { display: none; }
  #home .record .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd166, #ff9a3c); }
  #home .record .recent { font-size: 10px; color: #c9b088; letter-spacing: 1px; }
  /* 등수는 누르면 순위표가 열린다 — 밑줄로 "눌린다"를 말한다. */
  #home .record .rankbtn {
    margin-top: 5px; font-size: 10px; color: #ffd166; text-decoration: underline;
  }
  #home .record .rankbtn[hidden] { display: none; }

  /* 매치 버튼보다 한 급 낮은 것. 같은 나무 액자를 주면 "이것도 게임 시작"
     으로 읽힌다 — 여긴 꾸미는 자리다. */
  #home .btn-sub {
    margin-top: 2px; padding: 5px 0; font-size: 11px; color: #cbb794;
    text-decoration: underline; text-align: left;
  }
  #home .btn-sub:hover { color: #ffe1a0; }

  /* ── 아바타 고르기 ──────────────────────────────────── */
  #skins {
    position: absolute; inset: 0; z-index: 80;
    animation: veilin .3s ease-out;
    display: flex; align-items: center; justify-content: center;
    background: #06040bc4;
  }
  #skins[hidden] { display: none; }
  #skins .sheet {
    animation: sheetin .42s cubic-bezier(.16,1,.3,1);
    width: 520px; max-height: 330px; display: flex; flex-direction: column; gap: 8px;
    padding: 10px 12px 12px;
  }
  #skins .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; overflow-y: auto;
    /* 행이 제 크기를 갖게 한다. 기본값은 남은 높이에 맞춰 행을 늘리거나
       **줄여서**, 172px 짜리 그림이 40px 칸에 잘려 들어간다. */
    align-content: start;
  }
  /* 그림이 카드고, 글자는 그 위에 얹는다. 아래에 글자 띠를 두면 카드 절반이
     텍스트가 되어 정작 무엇인지 보러 온 그림이 작아진다. */
  /* 칸은 있어야 한다 — 어두운 아바타가 어두운 판 위에 뜨면 어디까지가 한
     칸인지 안 보이고, 잠긴 것은 아예 사라진다. 없앤 건 상자가 아니라 상점
     카드에서 딸려 온 **하단 회색 띠**다. */
  #skins .card {
    position: relative; height: 190px; border-radius: 4px; cursor: pointer; overflow: hidden;
    background: linear-gradient(180deg, #3a2a1e, #1d1410);
    box-shadow: inset 0 0 0 1px #00000059, inset 0 1px 0 #ffffff14;
    color: #e9dcc2;
  }
  #skins .card:hover { background: linear-gradient(180deg, #4a361f, #241812); }
  /* 상점 카드가 쓰는 후광. 그림만 보러 온 자리에 상자를 하나 더 그린다. */
  #skins .card::before { display: none; }
  #skins .card img { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: auto; }
  /* 글자 뒤에만 옅은 그늘. 밝은 갑옷 위에서도 이름이 읽혀야 한다.
     상점 카드의 .nm 은 카드 폭을 꽉 채우는 하단 띠다 — 폭·높이·배경을 전부
     되돌려야 회색 상자가 사라진다. 하나라도 빠뜨리면 띠가 그대로 남는다. */
  #skins .card .nm,
  #skins .card .why {
    position: absolute; left: 7px; right: auto; top: auto;
    display: block; width: auto; height: auto; padding: 0;
    background: none; box-shadow: none; letter-spacing: 0;
    line-height: 1.2; text-shadow: 0 1px 3px #000, 0 0 8px #000a;
  }
  #skins .card .nm { bottom: 17px; font-size: 12px; font-weight: 800; }
  #skins .card .why { bottom: 4px; font-size: 10px; color: #f0c56a; }
  /* 잠긴 것은 눌러도 안 되지만 **보이기는 한다** — 무엇이 기다리는지 알아야
     패스를 살 이유가 생긴다. */
  #skins .card.locked { cursor: default; }
  #skins .card.locked img { filter: brightness(0.35) grayscale(1); }
  #skins .card.on {
    box-shadow: inset 0 0 0 2px #ffd166cc;
    background: linear-gradient(180deg, #55401f, #2a1d10);
  }
  #skins #skins-close {
    align-self: center; font-size: 11px; color: #cbb794; text-decoration: underline;
  }

  /* 창 겉모습은 게임 안과 같은 나무 액자를 쓴다. 둥근 모서리에 남색 판은
     이 게임 어디에도 없는 재질이라, 그 창만 다른 프로그램에서 떠 온 것처럼
     보인다 — 상점·상세 패널과 같은 판자여야 같은 세계로 읽힌다. */
  #skins .sheet,
  #passtrack .sheet,
  #board .sheet {
    border-style: solid; border-width: 12px; border-image-slice: 6;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/panel_wood.png');
    image-rendering: pixelated;
    background: linear-gradient(180deg, #2a1d16, #170f0c);
    filter: drop-shadow(0 12px 26px #000b);
  }
  /* 안쪽 내용까지 도트로 뭉개지면 안 된다 — 액자만 픽셀이다. */
  #skins .sheet > *,
  #passtrack .sheet > *,
  #board .sheet > * { image-rendering: auto; }

  /* 시트가 툭 뜨면 어디서 온 창인지 안 읽힌다. 작게 시작해 커지면 눈이 그
     자리를 따라간다. 짧으면(.26s) 눈이 따라잡기 전에 끝나 "그냥 나타났다"로
     읽혀서, 커지는 구간을 사람이 볼 수 있을 만큼 길게 잡았다. */
  @keyframes sheetin {
    from { opacity: 0; transform: scale(.6); }
    to   { opacity: 1; transform: scale(1); }
  }
  /* 닫을 때도 줄어들며 사라져야 "그 창이 접혔다"가 된다. 열 때만 애니메이션을
     주면 닫는 순간 화면이 툭 끊겨 방금 뭘 눌렀는지 되짚게 된다.
     닫기는 열기보다 짧다 — 이미 볼 것을 다 본 뒤라 기다림이 길면 답답하다. */
  @keyframes sheetout {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(.72); }
  }
  @keyframes veilin { from { opacity: 0; } }
  @keyframes veilout { to { opacity: 0; } }
  #skins.closing, #board.closing, #passtrack.closing { animation: veilout .24s ease-in forwards; }
  #skins.closing .sheet,
  #passtrack.closing .sheet,
  #board.closing .sheet { animation: sheetout .24s cubic-bezier(.4,0,.9,.5) forwards; }

  /* ── 순위표 ─────────────────────────────────────────── */
  #board {
    position: absolute; inset: 0; z-index: 80;
    animation: veilin .3s ease-out;
    display: flex; align-items: center; justify-content: center;
    background: #06040bc4;
  }
  #board[hidden] { display: none; }
  #board .sheet {
    animation: sheetin .42s cubic-bezier(.16,1,.3,1);
    width: 320px; max-height: 300px; display: flex; flex-direction: column; gap: 6px;
    padding: 10px 12px 12px;
  }
  #board .bhead,
  #passtrack .bhead,
  #skins .bhead { display: flex; align-items: baseline; gap: 8px; }
  #board .bhead b,
  #passtrack .bhead b,
  #skins .bhead b { font-size: 15px; color: #ffe1a0; }
  #board .bhead span,
  #passtrack .bhead span,
  #skins .bhead span { font-size: 10px; color: #a99a86; }
  #board .rows { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  #board .row {
    display: flex; align-items: center; gap: 8px; padding: 4px 7px; border-radius: 5px;
    font-size: 11px; color: #e9dcc2;
  }
  /* 내 줄. 목록에서 나를 못 찾으면 순위표를 볼 이유가 없다. */
  #board .row.mine { background: #ffd1661f; box-shadow: inset 0 0 0 1px #ffd16659; }
  #board .row .no { width: 22px; color: #c9b088; font-variant-numeric: tabular-nums; }
  #board .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board .row .lp { color: #ffd166; font-variant-numeric: tabular-nums; }
  #board .empty { font-size: 11px; color: #a99a86; padding: 10px 4px; }
  #board #board-close {
    align-self: center; margin-top: 2px; font-size: 11px; color: #cbb794; text-decoration: underline;
  }
  #home .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 배경 그림 조각. brightness(0) 으로 눌러 실루엣만 남긴다 — 팩은 평면
     컬러라 그대로 얹으면 밤 하늘 위에 낮 그림이 붙은 꼴이 된다.
     멀수록 옅게: 거리에 따라 대비가 줄어야 깊이가 생긴다. */
  /* 불티. 배경이 멈춰 있으면 화면이 죽은 사진처럼 보인다. 몇 점만 아주
     느리게 올린다 — 많으면 메뉴를 읽는 눈이 따라다닌다. */
  #home .ember {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #ffb35c; box-shadow: 0 0 6px #ff8a3c;
    animation: rise 9s linear infinite; opacity: 0;
  }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: .9; }
    100% { transform: translateY(-190px); opacity: 0; }
  }
  /* 간판 캐릭터. 부팅 때 3D 모델을 한 번 크게 찍어 건다 (prep.heroPortrait).
     2D 일러스트를 따로 그리면 모델을 바꿀 때마다 어긋난다. */
  /* 화면 높이의 3/4 를 먹으면 배경이 안 보이고 캐릭터만 남는다. 60% 로 줄이고
     바닥 띠에 발을 붙인다. */
  /* 채도를 조금 낮추고 주황 빛무리를 두른다 — 모델 렌더는 배경보다 채도가
     높아 그것만으로도 오려 붙인 티가 난다. 빛무리는 배경의 노을과 캐릭터
     윤곽을 잇는 역할이다. */
  #home .hero {
    position: absolute; left: 52%; bottom: 22px; transform: translateX(-50%);
    height: 236px; width: auto; pointer-events: none;
    filter: saturate(.93) drop-shadow(0 0 16px #ff8a3c3d) drop-shadow(0 6px 14px #000a);
  }
  #home .hero:not([src]) { display: none; }
  /* 살아 있는 간판. 정지 초상과 같은 자리·같은 크기라 교대가 안 보인다. */
  #home .hero3d-mount {
    position: absolute; left: 52%; bottom: 22px; transform: translateX(-50%);
    width: 250px; height: 250px;
    /* 캔버스는 눌린다 — 몸을 누르면 움찔한다(heroView 의 레이캐스트).
       빈 자리는 레이캐스트가 걸러 내므로 뒤 버튼을 막지 않는다. */
    pointer-events: auto;
  }
  #home .hero3d-mount[hidden] { display: none; }
  #home .hero3d-mount canvas { display: block; width: 100%; height: 100%; }
  /* 발밑 그림자. 없으면 선 것도 나는 것도 아닌 채로 떠 있다. */
  #home .hero-shadow {
    position: absolute; left: 52%; bottom: 30px; transform: translateX(-50%);
    width: 116px; height: 20px; pointer-events: none;
    background: radial-gradient(50% 50% at 50% 50%, #000000aa 0%, #00000000 72%);
  }
  /* 시즌 패스 요약. 누르면 트랙이 열린다. */
  #home .pass {
    position: absolute; right: 10px; bottom: 10px; width: 186px; height: 132px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    border-style: solid; border-width: 12px; border-image-slice: 12 fill;
    border-image-repeat: repeat; border-image-source: url('/assets/ui/lobby_panel.png');
    image-rendering: pixelated; cursor: pointer;
  }
  #home .pass:hover { filter: brightness(1.12); }
  #home .pass:active { transform: translateY(1px); }
  #home .pass .gemico { width: 24px; image-rendering: pixelated; }
  #home .pass .ttl { font-size: 17px; font-weight: 900; color: #ffd98a; text-shadow: 0 2px 0 #6b4a2a; }
  #home .pass .lv { font-size: 12px; font-weight: 800; color: #ffe1a0; }
  /* 게이지. 숫자만 적으면 "얼마나 남았나"를 매번 뺄셈해야 한다. */
  #home .pass .bar {
    width: 118px; height: 5px; background: #00000066; box-shadow: inset 0 0 0 1px #00000059;
  }
  #home .pass .bar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #ffd166, #ff9a3c);
  }
  #home .pass .sub { font-size: 10px; color: #cbb794; }

  /* ── 패스 트랙 ──────────────────────────────────────── */
  #passtrack {
    position: absolute; inset: 0; z-index: 80;
    animation: veilin .3s ease-out;
    display: flex; align-items: center; justify-content: center;
    background: #06040bc4;
  }
  #passtrack[hidden] { display: none; }
  #passtrack .sheet {
    animation: sheetin .42s cubic-bezier(.16,1,.3,1);
    width: 600px; display: flex; flex-direction: column; gap: 8px;
    padding: 10px 12px 12px;
  }
  /* 가로로 민다. 25칸을 세로로 세우면 한 화면에 네댓 줄만 보인다. */
  #passtrack .track {
    display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding-bottom: 4px;
  }
  #passtrack .step {
    flex: none; width: 62px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  #passtrack .lv {
    width: 100%; text-align: center; font-size: 10px; font-weight: 800; color: #8f8069;
    background: #00000059; border-radius: 3px; padding: 1px 0;
  }
  /* 지난 칸에만 색을 준다 — 전부 같은 색이면 어디까지 왔는지 세어야 한다. */
  #passtrack .step.got .lv { color: #2a1d10; background: #ffd166; }
  #passtrack .rw {
    width: 100%; height: 58px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #3a2a1e, #1d1410);
    box-shadow: inset 0 0 0 1px #00000059; border-radius: 4px;
    font-size: 12px; font-weight: 800; color: #9fd7ff;
  }
  #passtrack .rw.av { position: relative; padding: 2px; }
  #passtrack .rw.av img { width: 100%; height: 100%; object-fit: contain; }
  /* 아바타와 젬을 같이 주는 단계. 젬을 모서리 딱지로 얹는다 — 칸을 둘로
     쪼개면 이 트랙에서 아바타가 제일 작은 그림이 된다. */
  #passtrack .badge {
    position: absolute; right: 1px; bottom: 1px;
    display: flex; align-items: center; padding: 0 3px; border-radius: 3px;
    background: #0b0810d9; box-shadow: inset 0 0 0 1px #ffffff1f;
    font-size: 9px; font-weight: 800; color: #9fd7ff;
  }
  #passtrack .gem::before {
    content: ''; width: 13px; height: 13px; margin-right: 3px;
    background: url('/assets/ui/gem.png') center/contain no-repeat; image-rendering: pixelated;
  }
  #passtrack .badge.gem::before { width: 9px; height: 9px; margin-right: 2px; }
  #passtrack .rw.none { opacity: .25; }
  /* 프리미엄 줄. 아직 못 사므로 눌러도 아무 일이 없다 — 색으로 그렇게 읽히게
     둔다. 숨기면 무엇을 놓치는지 몰라 나중에 살 이유도 안 생긴다. */
  #passtrack .prem { width: 100%; }
  #passtrack .prem .rw {
    height: 30px; filter: grayscale(.7) brightness(.8);
    box-shadow: inset 0 0 0 1px #ffd16640;
  }
  #passtrack .premnote {
    display: flex; align-items: center; gap: 5px; font-size: 10px; color: #a99a86;
  }
  #passtrack .premnote img { width: 12px; image-rendering: pixelated; }
  #passtrack #pass-close {
    align-self: center; font-size: 11px; color: #cbb794; text-decoration: underline;
  }
  #home .conn {
    position: absolute; right: 8px; top: 8px; display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: #e6cfa2;
    background: #2a1f14e8; box-shadow: inset 0 0 0 1px #d8b98455; padding: 3px 8px;
  }
  #home .conn button { font-size: 10px; color: #ffd98a; text-decoration: underline; }
  #home .conn button[hidden] { display: none; }

  #boot {
    position: fixed; inset: 0; z-index: 80;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: var(--bg); color: var(--dim);
  }
  #boot .bar {
    width: 220px; height: 10px; border-radius: 5px; overflow: hidden;
    background: #00000070; box-shadow: inset 0 0 0 1px #ffffff20;
  }
  #boot .bar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #3aa0d8, #7ee0c0);
    transition: width .12s linear;
  }
  #boot .pct { font-variant-numeric: tabular-nums; font-size: 12px; }
</style>
</head>
<body>
  <div id="viewport">
  <div id="prep" class="screen" hidden>
    <div id="stage">
      <div id="top">
        <div id="topwrap">
          <div id="topbar" class="n9">
            <span id="roundtag">1-1</span>
            <span id="track"></span>
            <span id="timer">30</span>
            <span id="pop">0/3</span>
          </div>
          <div id="timebar"><i></i></div>
        </div>
      </div>

      <div id="traits"></div>
      <div id="lobby"></div>

      <div id="info" class="panel" hidden></div>
      <div id="traitinfo" class="panel" hidden></div>
      <div id="hint"></div>

      <div id="hudbar">
        <div id="hudL">
          <div id="lvbox">
            <span id="lvl">3</span>
            <span id="xprow"><span id="xpbar"><i></i></span><span id="xptext">0/2</span></span>
          </div>
          <div id="odds"></div>
        </div>
        <div id="hudC">
          <div id="gold"><span id="goldval">0</span></div>
          <div id="streak" class="none"></div>
        </div>
        <div id="hudR">
          <button id="lock" type="button" aria-label="상점 잠금"></button>
        </div>
      </div>
    </div>

    <div id="shopbar">
      <div id="sidebtns">
        <button class="btn" id="buyxp"><span class="kb">F</span>경험치 구매<span class="cost">4</span></button>
        <button class="btn" id="reroll"><span class="kb">D</span>새로고침<span class="cost">2</span></button>
      </div>
      <div id="shop"></div>
    </div>
  </div>

  <div id="home" hidden>
    <!-- 첫 실행 유도. 튜토리얼만 남기고 나머지를 덮는다 — 처음 온 사람이
         고를 것이 하나뿐이면 헤맬 일이 없다. 닫으면 사라진다. -->
    <div class="veil"></div>
    <div class="title">REROLL BEASTS</div>
    <div class="lobby-panel">
      <div class="menu" id="home-menu">
        <button class="btn-home" data-mode="normal">일반 매치</button>
        <button class="btn-home" data-mode="ranked">랭크 매치</button>
        <!-- 서버 없이 도는 유일한 경로다. 접속 상태와 무관하게 늘 눌린다. -->
        <button class="btn-home" data-mode="tutorial">튜토리얼</button>
        <!-- 처음 온 사람에게 어디를 누를지 말해 준다. 버튼 묶음 안에 두어야
             튜토리얼 줄에 붙는다 — 패널 바닥에 붙이면 아래 버튼들만큼 내려간다. -->
        <div class="firsthint" id="home-hint" hidden>
          <button class="go" id="hint-go">처음이라면 여기부터 시작</button>
          <button class="x" id="hint-close" title="닫기">✕</button>
        </div>
      </div>
      <button class="btn-sub" id="btn-skins">아바타 고르기</button>
      <div class="queue" id="queue-status" hidden>
        <span id="queue-text"></span>
        <button id="queue-cancel">취소</button>
      </div>
    </div>
    <!-- 프로필. 왼쪽 위 — 로비에서 눈이 먼저 가는 자리이고, 간판(가운데 위)
         과 메뉴(왼쪽) 사이라 셋이 한 줄기로 읽힌다. 메뉴와 같은 상자에 넣지
         않는 이유: 같이 있으면 "누르는 것"으로 읽히는데 이건 읽는 것이다. -->
    <div class="record" id="home-record">
      <div class="tierline">
        <i class="badge" id="record-badge"></i>
        <b id="record-tier">브론즈</b>
        <span id="record-lp"></span>
      </div>
      <div class="bar" id="record-bar" hidden><i></i></div>
      <div class="head" id="record-head">첫 판을 기다린다</div>
      <div class="recent" id="record-recent"></div>
      <button class="rankbtn" id="record-rank" hidden></button>
    </div>
    <!-- 아바타 고르기. 무대에서 걸어다닐 캐릭터를 정한다 — 싸우는 말과는
         무관하다(밸런스에 안 닿는다). -->
    <div id="skins" hidden>
      <div class="sheet">
        <div class="bhead"><b>아바타</b><span>무대에서 걸어다닐 모습이다. 전투에는 영향이 없다</span></div>
        <div class="grid" id="skins-grid"></div>
        <button id="skins-close">닫기</button>
      </div>
    </div>
    <!-- 순위표. 프로필의 등수를 누르면 열린다. -->
    <div id="board" hidden>
      <div class="sheet">
        <div class="bhead"><b>순위표</b><span id="board-sub"></span></div>
        <div class="rows" id="board-rows"></div>
        <button id="board-close">닫기</button>
      </div>
    </div>
    <i class="ember" style="left: 40%; bottom: 40px; animation-delay: 0s"></i>
    <i class="ember" style="left: 47%; bottom: 24px; animation-delay: 2.6s"></i>
    <i class="ember" style="left: 55%; bottom: 52px; animation-delay: 5.1s"></i>
    <i class="ember" style="left: 62%; bottom: 30px; animation-delay: 7.4s"></i>
    <i class="hero-shadow"></i>
    <!-- 정지 초상. 살아 있는 모델(hero3d)이 준비되면 그 뒤로 숨는다 —
         WebGL 컨텍스트를 못 얻는 기기에서는 이게 그대로 남는다. -->
    <img class="hero" id="home-hero" alt="" />
    <div class="hero3d-mount" id="home-hero3d"></div>
    <!-- 시즌 패스 요약. 누르면 트랙이 열린다. 단계와 게이지를 여기에 두는
         이유: 진행도가 안 보이면 눌러 볼 이유가 없다. -->
    <div class="pass" id="home-pass">
      <img class="gemico" src="/assets/ui/gem.png" alt="" />
      <div class="ttl">시즌 패스</div>
      <div class="lv" id="pass-lv">1단계</div>
      <div class="bar" id="pass-bar"><i></i></div>
      <div class="sub" id="pass-sub">준비 중</div>
    </div>
    <!-- 패스 트랙. 25단계를 **가로로** 민다 — 세로로 세우면 한 화면에 네댓
         줄만 보여 "얼마나 남았나"가 안 읽힌다. -->
    <div id="passtrack" hidden>
      <div class="sheet">
        <div class="bhead"><b>시즌 패스</b><span id="pass-head"></span></div>
        <div class="track" id="pass-rows"></div>
        <!-- 프리미엄 줄은 보이되 아직 못 산다. 결제는 다음 조각에서 붙는다 —
             동작 없는 구매 버튼을 여는 것보다 없는 편이 정직하다. -->
        <div class="premnote">
          <img src="/assets/ui/lock_closed.png" alt="" />아래 줄은 프리미엄 보상이다 · 구매는
          준비 중
        </div>
        <button id="pass-close">닫기</button>
      </div>
    </div>
    <div class="conn" id="home-conn">
      <span id="home-note"></span>
      <button id="home-retry" hidden>다시 시도</button>
    </div>
  </div>
  </div>

  <!-- 코치. 튜토리얼 동안 배치 화면 위에 뜬다. 판을 가리지 않게 아래쪽
       가운데에 눕히고, 짚는 곳은 불빛(.coach-lit)으로 따로 표시한다. -->
  <div id="coach" hidden>
    <div class="bubble">
      <i class="mark"></i>
      <span id="coach-text"></span>
      <button id="coach-fight" hidden>싸우자</button>
      <button id="coach-home" hidden>홈으로</button>
      <button id="coach-skip">건너뛰기</button>
    </div>
  </div>
  <div id="ghost"><img alt="" /></div>
  <div id="rotate">가로로 돌려주세요</div>
  <div id="boot">
    <div class="msg">불러오는 중…</div>
    <div class="bar"><i></i></div>
    <div class="pct">0%</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
